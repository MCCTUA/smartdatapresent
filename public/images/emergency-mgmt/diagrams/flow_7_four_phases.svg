<svg viewBox="0 0 1180 380" xmlns="http://www.w3.org/2000/svg" font-family="'Sarabun','Tahoma',sans-serif" role="img" aria-labelledby="t7 d7">
  <title id="t7">4 ระยะของทุกเหตุการณ์</title>
  <desc id="d7">ระบบดูแลครบวงจรทั้ง 4 ระยะ ก่อนเกิดเหตุ เริ่มเกิดเหตุ ระหว่างเหตุ และสิ้นสุดเหตุ</desc>
  <rect width="1180" height="380" fill="#FAF7EE"/>
  <text x="40" y="46" font-size="23" font-weight="700" fill="#0B5544">ดูแลครบทั้ง 4 ระยะของเหตุ — ไม่ใช่แค่ตอนเกิดเหตุ</text>
  <text x="40" y="70" font-size="13.5" fill="#5F6B65">เรื่องนี้ไม่ได้เริ่มตอนเกิด และไม่ได้จบตอนปิดเหตุ — Smart Center ดูแลตลอดวงจร</text>

  <!-- timeline base -->
  <line x1="100" y1="150" x2="1080" y2="150" stroke="#cfc6ad" stroke-width="3"/>
  <!-- dots -->
  <circle cx="190" cy="150" r="11" fill="#0F6E56"/>
  <circle cx="430" cy="150" r="11" fill="#BA7517"/>
  <circle cx="670" cy="150" r="11" fill="#A32D2D"/>
  <circle cx="910" cy="150" r="11" fill="#639922"/>

  <!-- phase 1 -->
  <text x="190" y="118" font-size="13" font-weight="700" fill="#0F6E56" text-anchor="middle">ระยะที่ 1</text>
  <rect x="70" y="186" width="240" height="118" rx="12" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="190" y="216" font-size="15" font-weight="700" fill="#0B5544" text-anchor="middle">ก่อนเกิดเหตุ</text>
  <text x="190" y="244" font-size="12" fill="#1F2A24" text-anchor="middle">ฐานข้อมูลพื้นที่เสี่ยง</text>
  <text x="190" y="264" font-size="12" fill="#1F2A24" text-anchor="middle">Sensor เฝ้าระวัง 24 ชม.</text>
  <text x="190" y="284" font-size="12" fill="#5F6B65" text-anchor="middle">เตรียมพร้อม · ป้องกัน</text>

  <!-- phase 2 -->
  <text x="430" y="118" font-size="13" font-weight="700" fill="#BA7517" text-anchor="middle">ระยะที่ 2</text>
  <rect x="310" y="186" width="240" height="118" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5"/>
  <text x="430" y="216" font-size="15" font-weight="700" fill="#BA7517" text-anchor="middle">เริ่มเกิดเหตุ</text>
  <text x="430" y="244" font-size="12" fill="#1F2A24" text-anchor="middle">ตรวจจับ + วิเคราะห์</text>
  <text x="430" y="264" font-size="12" fill="#1F2A24" text-anchor="middle">คัดกรองยืนยันเหตุจริง</text>
  <text x="430" y="284" font-size="12" fill="#5F6B65" text-anchor="middle">รู้เร็ว · ไม่ตื่นตูม</text>

  <!-- phase 3 -->
  <text x="670" y="118" font-size="13" font-weight="700" fill="#A32D2D" text-anchor="middle">ระยะที่ 3</text>
  <rect x="550" y="186" width="240" height="118" rx="12" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.5"/>
  <text x="670" y="216" font-size="15" font-weight="700" fill="#A32D2D" text-anchor="middle">ระหว่างเหตุ</text>
  <text x="670" y="244" font-size="12" fill="#1F2A24" text-anchor="middle">สั่งการทรัพยากร/ทีม</text>
  <text x="670" y="264" font-size="12" fill="#1F2A24" text-anchor="middle">แจ้งเตือนเฉพาะพื้นที่</text>
  <text x="670" y="284" font-size="12" fill="#5F6B65" text-anchor="middle">สั่งการแม่น · ประสานทัน</text>

  <!-- phase 4 -->
  <text x="910" y="118" font-size="13" font-weight="700" fill="#3d6b12" text-anchor="middle">ระยะที่ 4</text>
  <rect x="790" y="186" width="240" height="118" rx="12" fill="#EAF3DE" stroke="#639922" stroke-width="1.5"/>
  <text x="910" y="216" font-size="15" font-weight="700" fill="#3d6b12" text-anchor="middle">สิ้นสุดเหตุ</text>
  <text x="910" y="244" font-size="12" fill="#1F2A24" text-anchor="middle">สรุปรายงานอัตโนมัติ</text>
  <text x="910" y="264" font-size="12" fill="#1F2A24" text-anchor="middle">เก็บเป็นหลักฐาน/สถิติ</text>
  <text x="910" y="284" font-size="12" fill="#5F6B65" text-anchor="middle">มีหลักฐาน · ทบทวนได้</text>

  <!-- footer -->
  <rect x="40" y="346" width="6" height="20" fill="#0F6E56"/>
  <text x="56" y="361" font-size="11.5" font-weight="700" fill="#0B5544">Smart Center Solution Platform — ครบ 4 ระยะของเหตุ</text>
</svg>
