<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Center Solution Platform — ตัวอย่างระบบบริหารเหตุฉุกเฉิน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body { font-family: 'Sarabun','Noto Sans Thai',system-ui,sans-serif; color:#2B2B2B; background:#F7F4EC; -webkit-font-smoothing:antialiased; }
  ::selection { background:#1F6B4C; color:#fff; }
  button { font-family: inherit; }
  @keyframes em-toastIn { from { opacity:0; transform:translate(-50%,-14px);} to { opacity:1; transform:translate(-50%,0);} }
  @keyframes em-pulseRed { 0%,100% { box-shadow:0 0 0 0 rgba(192,73,47,0.5);} 50% { box-shadow:0 0 0 16px rgba(192,73,47,0);} }
  @keyframes em-pulseAmber { 0%,100% { box-shadow:0 0 0 0 rgba(224,165,38,0.5);} 50% { box-shadow:0 0 0 12px rgba(224,165,38,0);} }
  @keyframes em-fadeUp { from { opacity:0; transform:translateY(8px);} to { opacity:1; transform:translateY(0);} }
  @keyframes em-ping { 0%{transform:scale(1);opacity:.75;} 75%,100%{transform:scale(2.4);opacity:0;} }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:#D8D0BE; border-radius:8px; border:2px solid #F7F4EC; }
  .navbtn:hover { background:#F0F4F1 !important; }
  .alertrow:hover { background:#FBF5EE !important; }
  .pribtn:hover { background:#185A40 !important; }
  .pribtn:active { transform:scale(0.98); }
  .ghostbtn:hover { background:#F0F7F3 !important; }
  .chip-btn:hover { filter:brightness(0.97); }
  .mappin:hover { transform:translate(-50%,-50%) scale(1.12); }
  #screen { animation: em-fadeUp .25s ease; }
</style>
</head>
<body>
<div id="app" style="display:flex; height:100vh; width:100%; overflow:hidden; background:#F7F4EC;"></div>

<script>
// ============================================================
// Smart Center Solution Platform — standalone interactive demo (vanilla JS)
// ระบบบูรณาการข้อมูลเฝ้าระวังและบริหารจัดการเหตุฉุกเฉิน (APP-17)
// public-safe: ไม่มี brand supplier · ไม่มีราคา · §12-§13 compliant
// sample tenant: เทศบาลตำบลสาธิต · mock data ทั้งหมด
// pattern เดียวกับ elderly_app.html + smartlight-demo
// ============================================================

const C = {
  green:'#1F6B4C', greenDk:'#185A40', greenSoft:'#E8F1EC', greenLine:'#D6E6DC',
  cream:'#F7F4EC', ink:'#2B2B2B', muted:'#8C8576', faint:'#A89F8C',
  amber:'#E0A526', amberTx:'#B5851A', amberSoft:'#FBEFD6',
  red:'#C0492F', redSoft:'#F6DFD9', blue:'#2563A8', blueSoft:'#E2ECF6',
  violet:'#7C5CBF', violetSoft:'#EDE7F8', sky:'#2C9AB5', skySoft:'#DFF1F5',
  card:'#FFFFFF', cardLine:'#ECE7DB',
};

// ประเภทเหตุการณ์ (taxonomy เดียวกับระบบจริง · KPI 6 ประเภท)
const TYPES = {
  accident:    { label:'อุบัติเหตุ/เหตุร้าย', color:C.red,    soft:C.redSoft,    tx:'#9A3520' },
  nearmiss:    { label:'เกือบเกิดเหตุ',       color:C.amber,  soft:C.amberSoft,  tx:C.amberTx },
  surveillance:{ label:'เฝ้าระวัง',            color:C.green,  soft:C.greenSoft,  tx:C.greenDk },
  maintenance: { label:'ซ่อมบำรุง',            color:C.blue,   soft:C.blueSoft,   tx:'#1B4775' },
  activities:  { label:'กิจกรรม',              color:C.violet, soft:C.violetSoft, tx:'#5A3F94' },
  measurement: { label:'ตรวจวัด',              color:C.sky,    soft:C.skySoft,    tx:'#1E6E82' },
};

const TENANT = 'เทศบาลตำบลสาธิต';

// ---------- state ----------
const state = {
  page: 'dashboard',
  hintOpen: true,
  toast: null, toastType: 'success', _t: null,

  // KPI (ตัวอย่าง mock)
  kpi: { accident:3, nearmiss:5, surveillance:7, maintenance:2, activities:4, measurement:6 },

  // เหตุการณ์ที่เปิดอยู่ (active event drill-down)
  activeEvent: 'EV-2042',
  eventStep: 2,             // 1 รับแจ้ง · 2 ยืนยัน · 3 ต่อเนื่อง · 4 สิ้นสุด
  dispatched: false,        // สั่งการหน่วยงานแล้วหรือยัง
  notifiedPublic: false,    // แจ้งเตือนประชาชนแล้วหรือยัง (หลังคัดกรอง)

  // ห่วงโซ่หน่วยงานที่รับผิดชอบ
  units: [
    { key:'pcd',  name:'งานป้องกันและบรรเทาสาธารณภัย (ปภ.)', status:'pending', time:'' },
    { key:'pwd',  name:'กองช่าง/โยธา',                        status:'pending', time:'' },
    { key:'env',  name:'งานสุขาภิบาลและสิ่งแวดล้อม',          status:'pending', time:'' },
  ],

  // audit log ของเหตุการณ์
  log: [
    { time:'04:07', text:'รับแจ้งเหตุเพลิงไหม้ผ่าน LINE OA · ผู้แจ้งส่งภาพประกอบ 2 รูป' },
    { time:'04:07', text:'ระบบจับพิกัดจากผู้แจ้ง · สร้างหมุดบนแผนที่อัตโนมัติ' },
  ],

  // create-event form
  form: { title:'', type:'accident', desc:'', located:false, photo:false },

  // chemical DB
  chemSel: 'chlorine',

  // map filter
  mapFilter: 'all',

  // modules (ขายเท่าที่ต้องการ)
  modules: { intake:true, dispatch:true, map:true, chemical:true, resource:true, alert:true },
};

// ---------- helpers ----------
const pad = n => String(n).padStart(2,'0');
function now(){ const d=new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function nowS(){ const d=new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function showToast(msg, type='success'){
  clearTimeout(state._t);
  state.toast = msg; state.toastType = type;
  render();
  state._t = setTimeout(()=>{ state.toast = null; render(); }, 3800);
}

// ---------- actions ----------
function go(page){ state.page = page; state.hintOpen = true; render(); }

function confirmEvent(){
  if (state.eventStep < 2) state.eventStep = 2;
  state.log.push({ time:now(), text:'เจ้าหน้าที่ตรวจสอบแล้ว — ยืนยันว่าเป็นเหตุจริง (ก่อนแจ้งผู้บริหาร/ประชาชน)' });
  showToast('ยืนยันเหตุการณ์แล้ว · เจ้าหน้าที่ตรวจสอบก่อนเสมอ จึงค่อยส่งต่อ','success');
}

function dispatchUnit(i){
  const u = state.units[i];
  state.units = state.units.map((x,idx)=> idx===i ? {...x, status:'dispatched', time:now()} : x);
  state.dispatched = true;
  if (state.eventStep < 3) state.eventStep = 3;
  state.log.push({ time:now(), text:`สั่งการหน่วยงาน: ${u.name} — รับเรื่องและกำลังเข้าจุดเกิดเหตุ` });
  showToast(`ส่งต่อเหตุไปยัง ${u.name} แล้ว`,'success');
}

function notifyPublic(){
  if (state.eventStep < 2){ showToast('ต้องยืนยันเหตุการณ์ก่อน จึงจะแจ้งเตือนประชาชนได้','warn'); return; }
  state.notifiedPublic = true;
  state.log.push({ time:now(), text:'แจ้งเตือนประชาชนในรัศมีพื้นที่ได้รับผลกระทบ (geo-fence) ผ่าน LINE OA + SMS' });
  showToast('แจ้งเตือนประชาชนในพื้นที่รัศมีได้รับผลกระทบเรียบร้อย (ผ่านการคัดกรองแล้ว)','success');
}

function closeEvent(){
  state.eventStep = 4;
  state.log.push({ time:now(), text:'ปิดเหตุการณ์ · ข้อมูลถูกบันทึกเข้าฐานข้อมูลเหตุการณ์ (พร้อมใช้ทบทวน/ยื่นประเมิน)' });
  showToast('ปิดเหตุการณ์เรียบร้อย · บันทึกครบ 4 ขั้น พร้อมเรียกดูย้อนหลัง','success');
}

function resetEvent(){
  state.eventStep = 1; state.dispatched = false; state.notifiedPublic = false;
  state.units = state.units.map(u=>({...u, status:'pending', time:''}));
  state.log = [
    { time:now(), text:'รับแจ้งเหตุเพลิงไหม้ผ่าน LINE OA · ผู้แจ้งส่งภาพประกอบ 2 รูป' },
    { time:now(), text:'ระบบจับพิกัดจากผู้แจ้ง · สร้างหมุดบนแผนที่อัตโนมัติ' },
  ];
  showToast('รีเซ็ตเคสสาธิตเรียบร้อย','success');
}

function simulateIntake(){
  // จำลองเหตุใหม่เข้าจากช่องทางต่าง ๆ
  const ch = ['LINE OA','เว็บแจ้งเหตุ','สายด่วน','Sensor IoT'][Math.floor(Math.random()*4)];
  state.kpi.surveillance += 1;
  state.log.push({ time:now(), text:`มีเรื่องแจ้งเข้าใหม่ผ่าน ${ch} — เข้าคิวรอเจ้าหน้าที่คัดกรอง` });
  showToast(`รับเรื่องใหม่จาก ${ch} · ทุกช่องทางรวมเข้าศูนย์เดียว`,'success');
}

function submitForm(){
  if (!state.form.title.trim()){ showToast('กรุณากรอกชื่อเหตุการณ์ก่อน','warn'); return; }
  state.kpi[state.form.type] = (state.kpi[state.form.type]||0) + 1;
  const t = TYPES[state.form.type].label;
  showToast(`สร้างเหตุการณ์ "${state.form.title}" (${t}) เข้าศูนย์ข้อมูลกลางแล้ว`,'success');
  state.form = { title:'', type:'accident', desc:'', located:false, photo:false };
  setTimeout(()=>{ state.page='dashboard'; render(); }, 900);
}
function setForm(k,v){ state.form[k]=v; render(); }
function locateForm(){ state.form.located=true; render(); showToast('ปักหมุดพิกัดบนแผนที่แล้ว','success'); }
function photoForm(){ state.form.photo=true; render(); showToast('แนบรูปหน้างาน 1 รูปแล้ว','success'); }

function selChem(k){ state.chemSel=k; render(); }
function setMapFilter(f){ state.mapFilter=f; render(); }

function toggleModule(key){
  const turningOff = state.modules[key];
  state.modules = { ...state.modules, [key]: !state.modules[key] };
  const map = { intake:'create', dispatch:'event', map:'map', chemical:'chemical', resource:'resource' };
  if (map[key] && !state.modules[key] && state.page===map[key]) state.page='dashboard';
  showToast(turningOff ? 'ปิดโมดูลแล้ว — เมนูที่เกี่ยวข้องถูกซ่อนจาก sidebar' : 'เปิดใช้งานโมดูลเรียบร้อย', turningOff ? 'warn':'success');
}
function tog(key){ const on=state.modules[key]; return { trackBg: on?C.green:'#D8D0BE', knobX: on?'20px':'2px' }; }

window.EM = { go, confirmEvent, dispatchUnit, notifyPublic, closeEvent, resetEvent, simulateIntake, submitForm, setForm, locateForm, photoForm, selChem, setMapFilter, toggleModule, toggleHint:()=>{ state.hintOpen=!state.hintOpen; render(); } };

// ---------- icons ----------
const ic = {
  dash:'<rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect>',
  bell:'<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path>',
  plus:'<line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>',
  map:'<polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon><line x1="8" y1="2" x2="8" y2="18"></line><line x1="16" y1="6" x2="16" y2="22"></line>',
  flask:'<path d="M9 3h6"></path><path d="M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3"></path><path d="M7.5 14h9"></path>',
  truck:'<rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle>',
  gear:'<circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>',
  check:'<path d="M20 6 9 17l-5-5"></path>',
  clock:'<circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline>',
  pin:'<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle>',
  info:'<circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path>',
};
function svg(path, stroke='currentColor', size=19, sw=1.7){ return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`; }

// ---------- sidebar ----------
function navBtn(page, label, iconPath, enabled){
  if (!enabled) return '';
  const active = state.page===page;
  const bg = active ? `background:#DCEDE3;border-left:3px solid ${C.green};` : 'background:transparent;border-left:3px solid transparent;';
  return `<button class="navbtn" onclick="EM.go('${page}')" style="position:relative; display:flex; align-items:center; gap:12px; width:100%; padding:11px 13px; border:none; border-radius:10px; font-size:14px; font-weight:500; cursor:pointer; text-align:left; color:#3A3631; ${bg}">
    ${svg(iconPath,'#3A3631',18)}<span>${label}</span></button>`;
}
function sidebar(){
  const m = state.modules;
  return `<aside style="width:268px; flex-shrink:0; background:#fff; border-right:1px solid #E8E1D2; display:flex; flex-direction:column; height:100%;">
    <div style="padding:20px 18px 16px; border-bottom:1px solid #EFE9DC; display:flex; align-items:center; gap:12px;">
      <div style="width:42px; height:42px; border-radius:12px; background:${C.green}; display:flex; align-items:center; justify-content:center; flex-shrink:0;">${svg('<path d="M12 2 3 7v6c0 5 3.5 8 9 9 5.5-1 9-4 9-9V7z"></path><path d="M9 12l2 2 4-4"></path>','#fff',24,1.8)}</div>
      <div style="line-height:1.18;"><div style="font-size:15.5px; font-weight:700; color:${C.green};">Smart Center</div><div style="font-size:11px; color:#8C8576;">ศูนย์บริหารเหตุฉุกเฉิน · ${TENANT}</div></div>
    </div>
    <nav style="padding:13px 12px; display:flex; flex-direction:column; gap:3px; flex:1; overflow-y:auto;">
      <div style="font-size:10.5px; font-weight:600; color:#A89F8C; letter-spacing:.5px; padding:6px 10px 4px;">ศูนย์บัญชาการ</div>
      ${navBtn('dashboard','ภาพรวมสถานการณ์',ic.dash,true)}
      ${navBtn('event','เหตุการณ์ที่กำลังดำเนินการ',ic.bell,m.dispatch)}
      ${navBtn('map','แผนที่เหตุการณ์',ic.map,m.map)}
      ${navBtn('create','รับแจ้ง / สร้างเหตุการณ์',ic.plus,m.intake)}
      <div style="font-size:10.5px; font-weight:600; color:#A89F8C; letter-spacing:.5px; padding:14px 10px 4px;">ฐานข้อมูล</div>
      ${navBtn('chemical','ฐานข้อมูลสารเคมี',ic.flask,m.chemical)}
      ${navBtn('resource','ทรัพยากร / อุปกรณ์',ic.truck,m.resource)}
      <div style="font-size:10.5px; font-weight:600; color:#A89F8C; letter-spacing:.5px; padding:14px 10px 4px;">ระบบ</div>
      ${navBtn('settings','ตั้งค่า / โมดูล',ic.gear,true)}
    </nav>
    <div style="padding:13px; border-top:1px solid #EFE9DC;">
      <div style="display:flex; align-items:center; gap:10px; padding:10px 12px; background:#F4F0E6; border-radius:10px;">
        <div style="width:9px; height:9px; border-radius:50%; background:${C.green}; flex-shrink:0;"></div>
        <div style="font-size:11.5px; color:#6E6757;">ระบบออนไลน์ · รวมทุกช่องทางเข้าศูนย์เดียว</div></div>
    </div>
  </aside>`;
}

const TITLES = {
  dashboard:['ภาพรวมสถานการณ์','สรุปเหตุการณ์ทั้งหมดในพื้นที่ · มุมมองสำหรับผู้บริหาร'],
  event:['เหตุการณ์ที่กำลังดำเนินการ','ติดตามสถานะ · สั่งการหน่วยงาน · บันทึกการดำเนินการ'],
  map:['แผนที่เหตุการณ์','ตำแหน่งเหตุ + รัศมีพื้นที่ได้รับผลกระทบ'],
  create:['รับแจ้ง / สร้างเหตุการณ์','รวมการแจ้งจากทุกช่องทางเป็นเหตุการณ์เดียว'],
  chemical:['ฐานข้อมูลสารเคมี','ข้อมูลความปลอดภัย · ชุดป้องกัน · รัศมีอพยพ'],
  resource:['ทรัพยากร / อุปกรณ์','อุปกรณ์ระงับเหตุที่มี พร้อมจัดสรร'],
  settings:['ตั้งค่า / โมดูล','เปิด-ปิดโมดูลตามที่หน่วยงานใช้จริง'],
};
const HINTS = {
  dashboard:'เปิดด้วย pain ของผู้บริหาร — "มีเหตุอะไรบ้าง รู้ครบที่เดียว". การ์ด 6 ประเภทคือภาพรวม คลิกแถวแจ้งเตือนเพื่อเจาะเข้าเหตุการณ์. กดปุ่ม "จำลองเรื่องแจ้งเข้าใหม่" ให้ผู้ชมเห็นว่าทุกช่องทาง (LINE/เว็บ/สายด่วน/Sensor) ไหลเข้าศูนย์เดียว',

function kpiCard(typeKey, value){
  const t = TYPES[typeKey];
  return `<button class="chip-btn" onclick="EM.go('${typeKey==='accident'?'event':'map'}')" style="text-align:left; background:#fff; border:1px solid ${C.cardLine}; border-radius:13px; padding:15px 16px; box-shadow:0 1px 3px rgba(43,43,43,0.05); cursor:pointer;">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:9px;">
      <span style="font-size:12.5px; color:#8C8576; font-weight:500;">${t.label}</span>
      <span style="width:10px; height:10px; border-radius:50%; background:${t.color};"></span></div>
    <div style="font-size:30px; font-weight:700; color:${C.ink}; line-height:1;">${value}<span style="font-size:14px; font-weight:500; color:#9A927F;"> ครั้ง</span></div>
  </div></button>`;
}

// ---------- screen: event (4-step timeline) ----------
function screenEvent(){
  const s = state.eventStep;
  const stepDone=C.green, stepIdle='#E3DDCE';
  const st = n => s>n ? {bg:stepDone,fg:'#fff',tx:C.green} : s===n ? {bg:C.green,fg:'#fff',tx:C.green} : {bg:stepIdle,fg:'#9A927F',tx:'#9A927F'};
  const line = n => s>=n ? C.green : '#E3DDCE';
  const steps = [['1','รับแจ้งเหตุ',st(1)],['2','ยืนยันเหตุการณ์',st(2)],['3','สั่งการ/ดำเนินการ',st(3)],['4','ปิดเหตุการณ์',st(4)]];
  let stepper='';
  steps.forEach((x,i)=>{
    if(i>0) stepper += `<div style="flex:1; height:2px; background:${line(i+1)}; margin:0 6px 22px;"></div>`;
    stepper += `<div style="display:flex; flex-direction:column; align-items:center; gap:8px; flex:0 0 auto;"><div style="width:36px; height:36px; border-radius:50%; background:${x[2].bg}; color:${x[2].fg}; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px;">${s>i+1?'✓':x[0]}</div><span style="font-size:12px; font-weight:600; color:${x[2].tx}; text-align:center;">${x[1]}</span></div>`;
  });
  const unitRow = (u,i) => {
    const map = { pending:['รอสั่งการ','#9A927F','#F1ECDF'], dispatched:['สั่งการแล้ว · กำลังเข้าจุดเกิดเหตุ',C.greenDk,C.greenSoft] };
    const m = map[u.status];
    const btn = u.status==='pending'
      ? `<button class="pribtn" onclick="EM.dispatchUnit(${i})" style="background:${C.green}; color:#fff; border:none; border-radius:9px; padding:8px 14px; font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap;">สั่งการ</button>`
      : `<span style="font-size:12px; color:${C.greenDk}; display:inline-flex; align-items:center; gap:5px;">${svg(ic.check,C.greenDk,15,2.2)} ${u.time}</span>`;
    return `<div style="display:flex; align-items:center; gap:12px; padding:13px 16px; border:1px solid ${C.cardLine}; border-radius:11px; background:#fff;">
      <div style="flex:1; min-width:0;"><div style="font-size:13.5px; font-weight:600; color:${C.ink};">${u.name}</div><div style="font-size:11.5px; color:${m[1]};">${m[0]}</div></div>${btn}</div>`;
  };
  const logRows = state.log.map(l=>`<div style="display:flex; gap:11px; padding:9px 0; border-bottom:1px dashed #EFE9DC;"><span style="font-size:11.5px; color:#B0A892; font-variant-numeric:tabular-nums; flex-shrink:0; width:42px;">${l.time}</span><span style="font-size:12.5px; color:#6E6757; line-height:1.45;">${esc(l.text)}</span></div>`).join('');
  const t = TYPES.accident;
  return `<div style="display:grid; grid-template-columns:1.4fr 1fr; gap:16px; align-items:start;">
    <div style="display:flex; flex-direction:column; gap:16px;">
      <div style="background:#fff; border:1px solid ${C.cardLine}; border-radius:13px; box-shadow:0 1px 3px rgba(43,43,43,0.05); padding:18px 22px;">
        <div style="display:flex; align-items:center;">${stepper}</div>
      </div>
      <div style="background:#fff; border:1px solid ${C.cardLine}; border-radius:13px; box-shadow:0 1px 3px rgba(43,43,43,0.05); padding:18px 20px;">
        <div style="display:flex; align-items:flex-start; gap:14px; margin-bottom:6px;">
          <div style="width:46px; height:46px; border-radius:11px; background:${t.soft}; color:${t.color}; display:flex; align-items:center; justify-content:center; flex-shrink:0;">${svg('<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path>',t.color,24,1.7)}</div>
          <div style="flex:1;"><div style="font-size:11px; font-weight:600; color:${t.tx}; background:${t.soft}; display:inline-block; padding:3px 10px; border-radius:999px; margin-bottom:5px;">${t.label}</div>
            <div style="font-size:18px; font-weight:700; color:${C.ink};">เพลิงไหม้ อาคารพาณิชย์ ถ.สาธิต 4</div>
            <div style="font-size:12.5px; color:#9A927F; margin-top:2px;">รับแจ้ง 04:07 · ผ่าน LINE OA · ${TENANT} · รหัส ${state.activeEvent}</div></div>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:14px;">
          <button class="pribtn" onclick="EM.confirmEvent()" ${s>=2?'disabled':''} style="background:${s>=2?'#CFE3D8':C.green}; color:#fff; border:none; border-radius:10px; padding:9px 15px; font-size:13px; font-weight:600; cursor:${s>=2?'default':'pointer'};">${s>=2?'✓ ยืนยันแล้ว':'ยืนยันเหตุการณ์'}</button>
          <button class="ghostbtn" onclick="EM.notifyPublic()" style="background:#fff; color:${state.notifiedPublic?'#9A927F':C.green}; border:1.5px solid ${state.notifiedPublic?'#D8D0BE':C.green}; border-radius:10px; padding:9px 15px; font-size:13px; font-weight:600; cursor:pointer;">${state.notifiedPublic?'✓ แจ้งประชาชนแล้ว':'แจ้งเตือนประชาชน'}</button>
          <button class="ghostbtn" onclick="EM.closeEvent()" style="background:#fff; color:${C.ink}; border:1.5px solid ${C.cardLine}; border-radius:10px; padding:9px 15px; font-size:13px; font-weight:600; cursor:pointer;">ปิดเหตุการณ์</button>
          <button class="ghostbtn" onclick="EM.resetEvent()" style="background:#fff; color:#9A927F; border:1.5px solid ${C.cardLine}; border-radius:10px; padding:9px 13px; font-size:13px; font-weight:500; cursor:pointer;">รีเซ็ตสาธิต</button>
        </div>
        <div style="margin-top:14px; padding:11px 13px; background:#FBF9F3; border-radius:10px; font-size:12px; color:#8C8576; display:flex; gap:8px; align-items:flex-start;">${svg(ic.info,'#A89F8C',15,2)}<span>กลไกคัดกรอง: เจ้าหน้าที่ได้รับทุกเหตุและตรวจสอบก่อนเสมอ — ปุ่ม "แจ้งเตือนประชาชน" จะใช้ได้ก็ต่อเมื่อยืนยันเหตุการณ์แล้ว</span></div>
      </div>
      <div style="background:#fff; border:1px solid ${C.cardLine}; border-radius:13px; box-shadow:0 1px 3px rgba(43,43,43,0.05); padding:18px 20px;">
        <div style="font-size:15px; font-weight:700; margin-bottom:12px;">ส่งต่อหน่วยงานรับผิดชอบ</div>
        <div style="display:flex; flex-direction:column; gap:9px;">${state.units.map(unitRow).join('')}</div>
      </div>
    </div>
    <div style="background:#fff; border:1px solid ${C.cardLine}; border-radius:13px; box-shadow:0 1px 3px rgba(43,43,43,0.05); padding:18px 20px;">
      <div style="font-size:15px; font-weight:700; margin-bottom:6px; display:flex; align-items:center; gap:8px;">${svg(ic.clock,C.green,17,1.9)} บันทึกการดำเนินการ</div>
      <div style="font-size:12px; color:#9A927F; margin-bottom:10px;">ทุกการกระทำถูกบันทึกตามเวลา · ตรวจสอบย้อนหลังได้</div>
      <div style="max-height:380px; overflow-y:auto;">${logRows}</div>
    </div></div>`;
}

// ---------- screen: map ----------
function screenMap(){
  const pins = [
    { x:46, y:40, type:'accident', label:'เพลิงไหม้ ถ.สาธิต 4', big:true },
    { x:62, y:58, type:'nearmiss', label:'น้ำท่วมขัง ซ.เทศบาล 7' },
    { x:30, y:64, type:'nearmiss', label:'ต้นไม้เอียง ริมคลอง' },
    { x:72, y:34, type:'maintenance', label:'ไฟดับ ชุมชน 2' },
    { x:54, y:74, type:'measurement', label:'จุดตรวจวัดอากาศ' },
    { x:38, y:28, type:'surveillance', label:'กล้องเฝ้าระวังสะพาน' },
  ];
  const f = state.mapFilter;
  const shown = pins.filter(p=> f==='all' || p.type===f);
  const filterChips = [['all','ทั้งหมด','#6E6757','#EFE9DC']].concat(
    Object.entries(TYPES).map(([k,t])=>[k,t.label,t.color,t.soft])

    const active = f===k;
    return `<button class="chip-btn" onclick="EM.setMapFilter('${k}')" style="display:inline-flex; align-items:center; gap:6px; border:1.5px solid ${active?col:'#E3DDCE'}; background:${active?soft:'#fff'}; color:${active?col:'#6E6757'}; border-radius:999px; padding:6px 13px; font-size:12px; font-weight:600; cursor:pointer;">${k==='all'?'':`<span style="width:8px;height:8px;border-radius:50%;background:${col};"></span>`}${lab}</button>`;
  }).join('');
  const pinEls = shown.map(p=>{
    const t = TYPES[p.type];
    const ring = p.big ? `<span style="position:absolute; inset:-6px; border-radius:50%; background:${t.color}; opacity:.4; animation:em-ping 1.8s ease-out infinite;"></span>` : '';
    const radius = p.big ? `<span style="position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:190px; height:190px; border-radius:50%; background:rgba(192,73,47,0.10); border:2px dashed rgba(192,73,47,0.45); pointer-events:none;"></span>` : '';
    return `<div class="mappin" title="${esc(p.label)}" style="position:absolute; left:${p.x}%; top:${p.y}%; transform:translate(-50%,-50%); transition:transform .15s; cursor:pointer; z-index:${p.big?5:3};">
      ${radius}<span style="position:relative; display:flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:50% 50% 50% 0; transform:rotate(-45deg); background:${t.color}; box-shadow:0 3px 8px rgba(0,0,0,0.28);">${ring}<span style="width:9px; height:9px; border-radius:50%; background:#fff; transform:rotate(45deg);"></span></span></div>`;
  }).join('');
  return `<div>
    <div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;">${filterChips}</div>
    <div style="position:relative; height:520px; border:1px solid ${C.cardLine}; border-radius:14px; overflow:hidden; box-shadow:0 1px 3px rgba(43,43,43,0.05); background:
      linear-gradient(0deg, rgba(31,107,76,0.04), rgba(31,107,76,0.04)),
      repeating-linear-gradient(0deg, #EEF2EC 0 1px, transparent 1px 46px),
      repeating-linear-gradient(90deg, #EEF2EC 0 1px, transparent 1px 46px),
      #F4F6F1;">
      <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute; inset:0; width:100%; height:100%;">
        <path d="M0 38 L100 30" stroke="#D9D2C2" stroke-width="2.4" fill="none"/>
        <path d="M44 0 L56 100" stroke="#D9D2C2" stroke-width="2.4" fill="none"/>

  const hint = HINTS[state.page] || '';
  const body = (SCREENS[state.page] || screenDashboard)();
  const toastColors = { success:[C.green,'#fff'], warn:[C.amber,'#3A2E08'], danger:[C.red,'#fff'] };
  const tc = toastColors[state.toastType] || toastColors.success;
  const toast = state.toast ? `<div style="position:fixed; top:18px; left:50%; transform:translateX(-50%); z-index:9999; background:${tc[0]}; color:${tc[1]}; padding:12px 20px; border-radius:12px; font-size:13.5px; font-weight:600; box-shadow:0 8px 26px rgba(0,0,0,0.22); animation:em-toastIn .25s ease; max-width:520px;">${esc(state.toast)}</div>` : '';

  document.getElementById('app').innerHTML = `
    ${sidebar()}
    <main style="flex:1; display:flex; flex-direction:column; min-width:0; height:100%;">
      <header style="flex-shrink:0; padding:18px 28px 14px; border-bottom:1px solid #ECE6D8; background:#FBFAF5;">
        <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:16px;">
          <div><h1 style="margin:0; font-size:21px; font-weight:700; color:${C.ink};">${title}</h1><p style="margin:3px 0 0; font-size:13px; color:#8C8576;">${sub}</p></div>
          <div style="display:flex; align-items:center; gap:10px;">
            <button onclick="EM.toggleHint()" style="display:inline-flex; align-items:center; gap:7px; background:${state.hintOpen?C.greenSoft:'#fff'}; color:${C.green}; border:1.5px solid ${C.green}; border-radius:9px; padding:7px 13px; font-size:12.5px; font-weight:600; cursor:pointer;">${svg(ic.info,C.green,15,2)} ${state.hintOpen?'ซ่อนคำใบ้':'คำใบ้ผู้นำเสนอ'}</button>
            <div style="display:flex; align-items:center; gap:9px; padding:6px 12px; background:#fff; border:1px solid ${C.cardLine}; border-radius:999px;"><div style="width:30px; height:30px; border-radius:50%; background:${C.greenSoft}; color:${C.green}; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px;">จ</div><div style="line-height:1.1;"><div style="font-size:12.5px; font-weight:600; color:${C.ink};">เจ้าหน้าที่ศูนย์</div><div style="font-size:10.5px; color:#9A927F;">${TENANT}</div></div></div>
          </div>
        </div>
        ${state.hintOpen && hint ? `<div style="margin-top:13px; padding:11px 15px; background:#FFF9E8; border:1px solid #F3E4B8; border-radius:11px; font-size:12.5px; color:#7A6515; line-height:1.55; display:flex; gap:9px; align-items:flex-start;">${svg('<path d="M9 18h6"></path><path d="M10 22h4"></path><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"></path>','#C9A227',16,1.8)}<span><b>คำใบ้ผู้นำเสนอ:</b> ${hint}</span></div>` : ''}
      </header>
      <div id="screen" style="flex:1; overflow-y:auto; padding:22px 28px 40px;">${body}</div>
    </main>
    ${toast}`;
}

render();
// ---------- end ----------
</script>
</body>
</html>
