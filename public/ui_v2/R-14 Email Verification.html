<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R-14 ยืนยัน Email — Resident Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #e8e8ed; }
  body { font-family: 'Noto Sans Thai', -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  @keyframes slideUp   { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
  @keyframes fadeIn    { from { opacity:0; } to { opacity:1; } }
  @keyframes checkPop  { 0% { transform:scale(0.4); opacity:0; } 60% { transform:scale(1.18); } 100% { transform:scale(1); opacity:1; } }
  @keyframes pulse     { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
  @keyframes spin      { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel">

const R14_TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "orgPrimary": "#1b61c9",
  "orgName": "อบต. ท่าขอนยาง",
  "emailAddress": "somchai@gmail.com"
}/*EDITMODE-END*/;

// ─── Countdown resend ─────────────────────────────────────────
function useCountdown(start) {
  const [count, setCount] = React.useState(start);
  React.useEffect(() => {
    if (count <= 0) return;
    const t = setTimeout(() => setCount(c => c - 1), 1000);
    return () => clearTimeout(t);
  }, [count]);
  return [count, () => setCount(start)];
}

// ─── SCREEN: Pending ──────────────────────────────────────────
function PendingScreen({ email, primary, orgName, onResend, onOpenApp }) {
  const [count, resetCount] = useCountdown(60);
  const [resent, setResent] = React.useState(false);

  function handleResend() {
    resetCount();
    setResent(true);
    onResend && onResend();
  }

  return (
    <div style={{ flex:1, background:'#F2F2F7', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'0 24px 60px' }}>
      {/* Icon */}
      <div style={{
        width: 88, height: 88, borderRadius: 28, background: `${primary}14`,
        display:'flex', alignItems:'center', justifyContent:'center', marginBottom: 28,
        animation: 'fadeIn 0.4s ease both',
      }}>
        <svg width="44" height="44" viewBox="0 0 44 44" fill="none">
          <rect x="4" y="10" width="36" height="26" rx="5" stroke={primary} strokeWidth="2" fill="none"/>
          <path d="M4 15l18 11 18-11" stroke={primary} strokeWidth="2" strokeLinecap="round"/>
          <circle cx="34" cy="34" r="7" fill="#fff" stroke={primary} strokeWidth="2"/>
          <path d="M31 34l2 2 4-4" stroke={primary} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      </div>

      <div style={{ textAlign:'center', animation:'slideUp 0.35s ease both', animationDelay:'0.05s' }}>
        <div style={{ fontSize:20, fontWeight:700, color:'#181d26', fontFamily:"'Noto Sans Thai', system-ui", marginBottom:10 }}>
          ส่ง link ยืนยันแล้ว
        </div>
        <div style={{ fontSize:14, color:'rgba(60,60,67,0.65)', fontFamily:"'Noto Sans Thai', system-ui", lineHeight:1.7, marginBottom:6 }}>
          ส่ง link ยืนยันไปที่
        </div>
        <div style={{
          display:'inline-block', background:`${primary}12`, borderRadius:10,
          padding:'6px 14px', marginBottom:20,
        }}>
          <span style={{ fontSize:14, fontWeight:600, color:primary, fontFamily:"'Noto Sans Thai', system-ui" }}>{email}</span>
        </div>
        <div style={{ fontSize:13, color:'rgba(60,60,67,0.55)', fontFamily:"'Noto Sans Thai', system-ui", lineHeight:1.7, marginBottom:28 }}>
          กรุณาตรวจสอบกล่องจดหมายและคลิก link<br/>ภายใน 24 ชั่วโมง — ตรวจสอบโฟลเดอร์ Spam ด้วย
        </div>
      </div>

      {/* Steps */}
      <div style={{
        background:'#fff', borderRadius:16, padding:'16px 18px', width:'100%', marginBottom:24,
        boxShadow:'0 1px 4px rgba(0,0,0,0.07)',
        animation:'slideUp 0.35s ease both', animationDelay:'0.1s',
      }}>
        {[
          { num:1, text:'เปิดอีเมลในแอปหรือ browser' },
          { num:2, text:'คลิก "ยืนยัน Email" ในอีเมลที่ได้รับ' },
          { num:3, text:'กลับมาที่แอปเพื่อรับการแจ้งเตือน' },
        ].map((step, i) => (
          <div key={i} style={{ display:'flex', alignItems:'flex-start', gap:12, marginBottom: i < 2 ? 12 : 0 }}>
            <div style={{
              width:24, height:24, borderRadius:12, background:`${primary}15`,
              display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0,
            }}>
              <span style={{ fontSize:12, fontWeight:700, color:primary, fontFamily:"'Noto Sans Thai', system-ui" }}>{step.num}</span>
            </div>
            <span style={{ fontSize:13, color:'rgba(60,60,67,0.75)', fontFamily:"'Noto Sans Thai', system-ui", lineHeight:1.7, paddingTop:2 }}>{step.text}</span>
          </div>
        ))}
      </div>

      {/* Resend */}
      <div style={{ width:'100%', animation:'slideUp 0.35s ease both', animationDelay:'0.15s' }}>
        {resent && (
          <div style={{
            background:'#f0fdf4', border:'1px solid #bbf7d0', borderRadius:10,
            padding:'8px 14px', marginBottom:12, textAlign:'center',
            fontSize:13, color:'#16a34a', fontFamily:"'Noto Sans Thai', system-ui",
          }}>ส่งอีเมลใหม่แล้ว — กรุณาตรวจสอบกล่องจดหมาย</div>
        )}
        <button
          onClick={handleResend}
          disabled={count > 0}
          style={{
            width:'100%', height:48, borderRadius:12, border:`1.5px solid ${count > 0 ? '#e0e2e6' : primary}`,
            background:'#fff', fontSize:15, fontWeight:500,
            fontFamily:"'Noto Sans Thai', system-ui",
            color: count > 0 ? 'rgba(60,60,67,0.35)' : primary,
            cursor: count > 0 ? 'not-allowed' : 'pointer', marginBottom:12,
            transition:'all 0.2s',
          }}
        >
          {count > 0 ? `ส่งใหม่ได้ใน ${count} วินาที` : 'ส่ง link ใหม่'}
        </button>
        <button
          onClick={onOpenApp}
          style={{
            width:'100%', height:48, borderRadius:12, border:'none',
            background: primary, fontSize:15, fontWeight:600,
            fontFamily:"'Noto Sans Thai', system-ui", color:'#fff',
            cursor:'pointer',
          }}
        >กลับสู่แอป</button>
      </div>
    </div>
  );
}

// ─── SCREEN: Success ──────────────────────────────────────────
function SuccessScreen({ email, primary, orgName, onOpenApp }) {
  return (
    <div style={{ flex:1, background:'#F2F2F7', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'0 24px 60px' }}>
      {/* Check icon */}
      <div style={{
        width: 100, height: 100, borderRadius: 50, background:'#f0fdf4',
        border:'3px solid #bbf7d0',
        display:'flex', alignItems:'center', justifyContent:'center', marginBottom:28,
        animation:'checkPop 0.5s cubic-bezier(0.34,1.56,0.64,1) both',
        animationDelay:'0.1s',
      }}>
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
          <path d="M10 24l10 10 18-20" stroke="#16a34a" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      </div>

      <div style={{ textAlign:'center', animation:'slideUp 0.35s ease both', animationDelay:'0.2s' }}>
        <div style={{ fontSize:22, fontWeight:700, color:'#181d26', fontFamily:"'Noto Sans Thai', system-ui", marginBottom:8 }}>
          ยืนยัน Email สำเร็จ ✓
        </div>
        <div style={{ fontSize:14, color:'rgba(60,60,67,0.6)', fontFamily:"'Noto Sans Thai', system-ui", lineHeight:1.7, marginBottom:8 }}>
          ยืนยันที่อยู่อีเมลเรียบร้อยแล้ว
        </div>
        <div style={{
          display:'inline-block', background:'#f0fdf4', borderRadius:10,
          padding:'6px 14px', marginBottom:28,
        }}>
          <span style={{ fontSize:14, fontWeight:600, color:'#16a34a', fontFamily:"'Noto Sans Thai', system-ui" }}>{email}</span>
        </div>
        <div style={{ fontSize:13, color:'rgba(60,60,67,0.55)', fontFamily:"'Noto Sans Thai', system-ui", lineHeight:1.7, marginBottom:32 }}>
          คุณจะได้รับบิลและการแจ้งเตือนจาก<br/><strong style={{ color:'rgba(60,60,67,0.75)' }}>{orgName}</strong><br/>ผ่านอีเมลนี้
        </div>
      </div>

      <div style={{ width:'100%', animation:'slideUp 0.35s ease both', animationDelay:'0.25s' }}>
        <button
          onClick={onOpenApp}
          style={{
            width:'100%', height:52, borderRadius:14, border:'none',
            background: primary, fontSize:16, fontWeight:600,
            fontFamily:"'Noto Sans Thai', system-ui", color:'#fff',
            cursor:'pointer', boxShadow:`0 4px 14px ${primary}44`,
          }}
        >กลับสู่แอป</button>
      </div>
    </div>
  );
}

// ─── SCREEN: Expired ──────────────────────────────────────────
function ExpiredScreen({ email, primary, onResend }) {
  const [sending, setSending] = React.useState(false);
  const [sent, setSent] = React.useState(false);

  function handleResend() {
    setSending(true);
    setTimeout(() => { setSending(false); setSent(true); }, 1200);
  }

  return (
    <div style={{ flex:1, background:'#F2F2F7', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'0 24px 60px' }}>
      <div style={{
        width:88, height:88, borderRadius:28, background:'#fef2f2',
        display:'flex', alignItems:'center', justifyContent:'center', marginBottom:28,
        animation:'fadeIn 0.4s ease both',
      }}>
        <svg width="44" height="44" viewBox="0 0 44 44" fill="none">
          <circle cx="22" cy="22" r="18" stroke="#dc2626" strokeWidth="2" fill="none"/>
          <path d="M22 14v12M22 30v2" stroke="#dc2626" strokeWidth="2.5" strokeLinecap="round"/>
        </svg>
      </div>

      <div style={{ textAlign:'center', animation:'slideUp 0.35s ease both', animationDelay:'0.05s' }}>
        <div style={{ fontSize:20, fontWeight:700, color:'#181d26', fontFamily:"'Noto Sans Thai', system-ui", marginBottom:10 }}>
          Link หมดอายุแล้ว
        </div>
        <div style={{ fontSize:14, color:'rgba(60,60,67,0.6)', fontFamily:"'Noto Sans Thai', system-ui", lineHeight:1.7, marginBottom:28 }}>
          Link ยืนยันอีเมลหมดอายุแล้ว<br/>กรุณาขอ link ใหม่เพื่อยืนยัน <strong>{email}</strong>
        </div>
      </div>

      {sent ? (
        <div style={{
          background:'#f0fdf4', border:'1px solid #bbf7d0', borderRadius:12,
          padding:'14px 18px', textAlign:'center', marginBottom:16, width:'100%',
          animation:'fadeIn 0.3s ease both',
        }}>
          <div style={{ fontSize:16, fontWeight:600, color:'#16a34a', fontFamily:"'Noto Sans Thai', system-ui", marginBottom:4 }}>ส่ง link ใหม่แล้ว</div>
          <div style={{ fontSize:13, color:'rgba(60,60,67,0.6)', fontFamily:"'Noto Sans Thai', system-ui" }}>กรุณาตรวจสอบอีเมลของคุณ</div>
        </div>
      ) : (
        <button
          onClick={handleResend}
          disabled={sending}
          style={{
            width:'100%', height:52, borderRadius:14, border:'none',
            background: sending ? '#e0e2e6' : primary, fontSize:16, fontWeight:600,
            fontFamily:"'Noto Sans Thai', system-ui", color: sending ? '#9ca3af' : '#fff',
            cursor: sending ? 'wait' : 'pointer',
            display:'flex', alignItems:'center', justifyContent:'center', gap:8,
            marginBottom:12,
          }}
        >
          {sending && <div style={{ width:18, height:18, borderRadius:9, border:'2px solid #fff4', borderTopColor:'#9ca3af', animation:'spin 0.7s linear infinite' }}/>}
          {sending ? 'กำลังส่ง...' : 'ขอ link ใหม่'}
        </button>
      )}
    </div>
  );
}

// ─── SCREEN: Invalid Token ────────────────────────────────────
function InvalidScreen({ primary }) {
  return (
    <div style={{ flex:1, background:'#F2F2F7', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'0 24px 60px' }}>
      <div style={{
        width:88, height:88, borderRadius:28, background:'#fffbeb',
        display:'flex', alignItems:'center', justifyContent:'center', marginBottom:28,
        animation:'fadeIn 0.4s ease both',
      }}>
        <svg width="44" height="44" viewBox="0 0 44 44" fill="none">
          <path d="M22 4L42 38H2L22 4Z" stroke="#d97706" strokeWidth="2" fill="none" strokeLinejoin="round"/>
          <path d="M22 18v10M22 32v2" stroke="#d97706" strokeWidth="2.5" strokeLinecap="round"/>
        </svg>
      </div>
      <div style={{ textAlign:'center' }}>
        <div style={{ fontSize:20, fontWeight:700, color:'#181d26', fontFamily:"'Noto Sans Thai', system-ui", marginBottom:10 }}>
          Link ไม่ถูกต้อง
        </div>
        <div style={{ fontSize:14, color:'rgba(60,60,67,0.6)', fontFamily:"'Noto Sans Thai', system-ui", lineHeight:1.7, marginBottom:28 }}>
          ไม่พบ link นี้ในระบบ<br/>อาจถูกใช้ไปแล้ว หรือ URL ไม่ถูกต้อง
        </div>
        <div style={{
          background:'#fffbeb', border:'1px solid #fde68a', borderRadius:12,
          padding:'12px 16px', marginBottom:28, textAlign:'left',
        }}>
          <div style={{ fontSize:12, color:'#92400e', fontFamily:"'Noto Sans Thai', system-ui", lineHeight:1.7 }}>
            • ตรวจสอบว่า copy link ครบถ้วน<br/>
            • ลอง request link ใหม่จากแอป<br/>
            • หากปัญหายังคงอยู่ติดต่อเจ้าหน้าที่
          </div>
        </div>
        <button style={{
          width:'100%', height:52, borderRadius:14, border:'none',
          background: primary, fontSize:16, fontWeight:600,
          fontFamily:"'Noto Sans Thai', system-ui", color:'#fff', cursor:'pointer',
        }}>กลับสู่แอป</button>
      </div>
    </div>
  );
}

// ─── App ──────────────────────────────────────────────────────
function R14App() {
  const [tweaks, setTweaks] = React.useState(R14_TWEAK_DEFAULTS);
  const [showTweaks, setShowTweaks] = React.useState(false);
  const [activeScreen, setActiveScreen] = React.useState('pending');
  const primary = tweaks.orgPrimary;

  React.useEffect(() => {
    window.addEventListener('message', e => {
      if (e.data?.type === '__activate_edit_mode') setShowTweaks(true);
      if (e.data?.type === '__deactivate_edit_mode') setShowTweaks(false);
    });
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
  }, []);

  const screens = {
    pending: { label:'Pending (รอ click link)', component: <PendingScreen email={tweaks.emailAddress} primary={primary} orgName={tweaks.orgName} onOpenApp={() => {}} /> },
    success: { label:'Success (verified)', component: <SuccessScreen email={tweaks.emailAddress} primary={primary} orgName={tweaks.orgName} onOpenApp={() => {}} /> },
    expired: { label:'Token expired', component: <ExpiredScreen email={tweaks.emailAddress} primary={primary} /> },
    invalid: { label:'Invalid token', component: <InvalidScreen primary={primary} /> },
  };

  return (
    <div style={{ display:'flex', flexDirection:'column', alignItems:'center', minHeight:'100vh', padding:'40px 20px' }}>
      <div style={{ marginBottom:14 }}>
        <span style={{ fontSize:12, fontWeight:600, color:'#6b7280', letterSpacing:0.5, textTransform:'uppercase', fontFamily:"'Noto Sans Thai', system-ui" }}>R-14 ยืนยัน Email</span>
      </div>
      {/* State picker */}
      <div style={{ display:'flex', gap:6, marginBottom:20, flexWrap:'wrap', justifyContent:'center' }}>
        {Object.entries(screens).map(([k,v]) => (
          <button key={k} onClick={() => setActiveScreen(k)} style={{
            padding:'5px 12px', borderRadius:20, border:'none', cursor:'pointer',
            fontSize:11, fontFamily:"'Noto Sans Thai', system-ui", fontWeight:500,
            background: activeScreen===k ? primary : '#e5e7eb',
            color: activeScreen===k ? '#fff' : '#374151',
            transition:'all 0.15s',
          }}>{v.label}</button>
        ))}
      </div>

      <IOSDevice>
        <IOSStatusBar />
        <IOSNavBar title="ยืนยัน Email" primary={primary} showBack />
        {screens[activeScreen].component}
      </IOSDevice>

      {showTweaks && (
        <div style={{
          position:'fixed', bottom:20, right:20, zIndex:9999,
          background:'#fff', borderRadius:16, padding:20, width:260,
          boxShadow:'0 8px 32px rgba(0,0,0,0.18)', fontFamily:"'Noto Sans Thai', system-ui",
        }}>
          <div style={{ fontSize:14, fontWeight:700, marginBottom:14, color:'#181d26' }}>Tweaks</div>
          <label style={{ fontSize:12, color:'#6b7280', display:'block', marginBottom:4 }}>Org Primary Color</label>
          <input type="color" value={tweaks.orgPrimary}
            onChange={e => { const t={...tweaks, orgPrimary:e.target.value}; setTweaks(t); window.parent.postMessage({type:'__edit_mode_set_keys',edits:{orgPrimary:e.target.value}},'*'); }}
            style={{ width:'100%', height:36, borderRadius:8, border:'1px solid #e0e2e6', cursor:'pointer', marginBottom:12 }}
          />
          <label style={{ fontSize:12, color:'#6b7280', display:'block', marginBottom:4 }}>Email Address</label>
          <input type="email" value={tweaks.emailAddress}
            onChange={e => { const t={...tweaks, emailAddress:e.target.value}; setTweaks(t); window.parent.postMessage({type:'__edit_mode_set_keys',edits:{emailAddress:e.target.value}},'*'); }}
            style={{ width:'100%', padding:'7px 10px', borderRadius:8, border:'1px solid #e0e2e6', fontSize:13, marginBottom:12 }}
          />
          <label style={{ fontSize:12, color:'#6b7280', display:'block', marginBottom:4 }}>ชื่อ อปท.</label>
          <input type="text" value={tweaks.orgName}
            onChange={e => { const t={...tweaks, orgName:e.target.value}; setTweaks(t); window.parent.postMessage({type:'__edit_mode_set_keys',edits:{orgName:e.target.value}},'*'); }}
            style={{ width:'100%', padding:'7px 10px', borderRadius:8, border:'1px solid #e0e2e6', fontSize:13, fontFamily:"'Noto Sans Thai', system-ui" }}
          />
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.body.appendChild(Object.assign(document.createElement('div'), {style:'display:contents'}))).render(<R14App />);
</script>
</body>
</html>
