<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A-05 ตั้งค่าการอนุมัติ LINE ราชการ — Admin Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --primary: #1b61c9;
  --primary-light: #eff6ff;
  --primary-dark: #1450a8;
  --gray-50: #f8fafc; --gray-100: #f1f5f9; --gray-200: #e2e8f0;
  --gray-300: #cbd5e1; --gray-400: #94a3b8; --gray-500: #64748b;
  --gray-600: #475569; --gray-700: #334155; --gray-800: #1e293b;
  --gray-900: #0f172a;
  --success: #16a34a; --success-bg: #f0fdf4; --success-border: #bbf7d0;
  --danger: #dc2626; --danger-bg: #fef2f2; --danger-border: #fca5a5;
  --warn-bg: #fffbeb; --warn-border: #fde68a; --warn-text: #92400e;
  --font: 'IBM Plex Sans Thai', sans-serif;
  --mono: 'IBM Plex Mono', monospace;
  --sidebar-w: 220px;
  --header-h: 56px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.08);
  --shadow: 0 2px 8px rgba(0,0,0,.10);
  --radius: 8px;
}
html, body { height: 100%; }
body { font-family: var(--font); background: var(--gray-100); color: var(--gray-800); font-size: 14px; line-height: 1.5; }
button { font-family: var(--font); cursor: pointer; border: none; background: none; }
input, select, textarea { font-family: var(--font); font-size: 14px; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--gray-300); border-radius: 3px; }
@keyframes fadeIn  { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
@keyframes spin    { to { transform:rotate(360deg); } }
@keyframes checkPop { 0% { transform:scale(0.5); opacity:0; } 70% { transform:scale(1.15); } 100% { transform:scale(1); opacity:1; } }
</style>
</head>
<body>
<script type="text/babel">

const A05_TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "orgPrimary": "#1b61c9",
  "orgName": "อบต. ท่าขอนยาง",
  "adminName": "นายสมศักดิ์ ใจดี"
}/*EDITMODE-END*/;

// ─── Sidebar nav items ────────────────────────────────────────
const NAV = [
  { icon: '🏢', label: 'ข้อมูลองค์กร' },
  { icon: '👥', label: 'จัดการผู้ใช้' },
  { icon: '🎨', label: 'ธีมและโลโก้' },
  { icon: '💬', label: 'LINE & การแจ้งเตือน', active: true },
  { icon: '🔐', label: 'ความปลอดภัย' },
  { icon: '📋', label: 'บันทึกระบบ' },
];

// ─── Sidebar ──────────────────────────────────────────────────
function Sidebar({ primary, orgName }) {
  return (
    <div style={{
      width: 'var(--sidebar-w)', flexShrink: 0, background: '#fff',
      borderRight: '1px solid var(--gray-200)', display: 'flex', flexDirection: 'column',
      height: '100%',
    }}>
      {/* Logo area */}
      <div style={{ padding: '16px 16px 14px', borderBottom: '1px solid var(--gray-200)' }}>
        <div style={{
          display: 'flex', alignItems: 'center', gap: 10,
        }}>
          <div style={{
            width: 36, height: 36, borderRadius: 10,
            background: `${primary}18`, display: 'flex', alignItems: 'center', justifyContent: 'center',
          }}>
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <rect x="2" y="2" width="6" height="6" rx="2" fill={primary}/>
              <rect x="10" y="2" width="6" height="6" rx="2" fill={primary} opacity=".5"/>
              <rect x="2" y="10" width="6" height="6" rx="2" fill={primary} opacity=".5"/>
              <rect x="10" y="10" width="6" height="6" rx="2" fill={primary} opacity=".3"/>
            </svg>
          </div>
          <div>
            <div style={{ fontSize: 12, fontWeight: 700, color: 'var(--gray-800)', lineHeight: 1.2 }}>Admin</div>
            <div style={{ fontSize: 11, color: 'var(--gray-500)', lineHeight: 1.3, maxWidth: 130, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{orgName}</div>
          </div>
        </div>
      </div>
      {/* Nav */}
      <nav style={{ flex: 1, padding: '10px 8px', overflowY: 'auto' }}>
        <div style={{ fontSize: 10, fontWeight: 600, color: 'var(--gray-400)', letterSpacing: 0.8, textTransform: 'uppercase', padding: '4px 8px 8px' }}>ตั้งค่าองค์กร</div>
        {NAV.map((item, i) => (
          <div key={i} style={{
            display: 'flex', alignItems: 'center', gap: 10,
            padding: '8px 10px', borderRadius: 6, marginBottom: 2, cursor: 'pointer',
            background: item.active ? `${primary}12` : 'transparent',
            color: item.active ? primary : 'var(--gray-600)',
            fontWeight: item.active ? 600 : 400,
            fontSize: 13,
            transition: 'all 0.15s',
          }}>
            <span style={{ fontSize: 15 }}>{item.icon}</span>
            <span>{item.label}</span>
            {item.active && <div style={{ width: 6, height: 6, borderRadius: 3, background: primary, marginLeft: 'auto' }} />}
          </div>
        ))}
      </nav>
      {/* Footer */}
      <div style={{ padding: '12px 16px', borderTop: '1px solid var(--gray-200)', fontSize: 12, color: 'var(--gray-500)' }}>
        <div style={{ fontWeight: 500, color: 'var(--gray-700)', marginBottom: 2 }}>นายสมศักดิ์ ใจดี</div>
        <div>Admin</div>
      </div>
    </div>
  );
}

// ─── Audit Row ────────────────────────────────────────────────
function AuditRow({ date, by, action, ref_, isLast }) {
  const isRevoke = action.includes('ยกเลิก');
  return (
    <div style={{
      display: 'flex', gap: 12, paddingBottom: isLast ? 0 : 14, marginBottom: isLast ? 0 : 14,
      borderBottom: isLast ? 'none' : '1px solid var(--gray-100)',
      position: 'relative',
    }}>
      <div style={{
        width: 8, height: 8, borderRadius: 4, marginTop: 5, flexShrink: 0,
        background: isRevoke ? 'var(--danger)' : 'var(--success)',
        boxShadow: isRevoke ? '0 0 0 3px #fee2e2' : '0 0 0 3px #dcfce7',
      }} />
      <div style={{ flex: 1 }}>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 8, flexWrap: 'wrap' }}>
          <span style={{ fontSize: 13, fontWeight: 600, color: 'var(--gray-800)' }}>{action}</span>
          {ref_ && <span style={{ fontSize: 11, fontFamily: 'var(--mono)', background: 'var(--gray-100)', borderRadius: 4, padding: '1px 6px', color: 'var(--gray-600)' }}>{ref_}</span>}
        </div>
        <div style={{ fontSize: 12, color: 'var(--gray-500)', marginTop: 2 }}>
          {date} · {by}
        </div>
      </div>
    </div>
  );
}

// ─── Field ────────────────────────────────────────────────────
function Field({ label, required, children, hint }) {
  return (
    <div style={{ marginBottom: 20 }}>
      <label style={{ fontSize: 13, fontWeight: 500, color: 'var(--gray-700)', display: 'block', marginBottom: 6 }}>
        {label} {required && <span style={{ color: 'var(--danger)' }}>*</span>}
      </label>
      {children}
      {hint && <div style={{ fontSize: 12, color: 'var(--gray-400)', marginTop: 4 }}>{hint}</div>}
    </div>
  );
}

function Input({ value, onChange, placeholder, mono, prefix }) {
  return (
    <div style={{ position: 'relative', display: 'flex', alignItems: 'center' }}>
      {prefix && (
        <span style={{
          position: 'absolute', left: 10, fontSize: 13, color: 'var(--gray-400)',
          fontFamily: mono ? 'var(--mono)' : 'var(--font)',
        }}>{prefix}</span>
      )}
      <input
        value={value} onChange={e => onChange(e.target.value)}
        placeholder={placeholder}
        style={{
          width: '100%', padding: prefix ? '9px 12px 9px 28px' : '9px 12px',
          border: '1.5px solid var(--gray-200)', borderRadius: 'var(--radius)',
          fontSize: 14, color: 'var(--gray-800)', background: '#fff',
          fontFamily: mono ? 'var(--mono)' : 'var(--font)',
          outline: 'none', transition: 'border-color 0.15s',
        }}
        onFocus={e => e.target.style.borderColor = 'var(--primary)'}
        onBlur={e => e.target.style.borderColor = 'var(--gray-200)'}
      />
    </div>
  );
}

// ─── Main App ─────────────────────────────────────────────────
function A05App() {
  const [tweaks, setTweaks] = React.useState(A05_TWEAK_DEFAULTS);
  const [showTweaks, setShowTweaks] = React.useState(false);
  const [viewState, setViewState] = React.useState('unauthorized'); // unauthorized | authorized | editing | saving | revokeConfirm
  const primary = tweaks.orgPrimary;

  // Form state
  const [refNo, setRefNo] = React.useState('');
  const [authorizedDate, setAuthorizedDate] = React.useState('');
  const [description, setDescription] = React.useState('');
  const [saving, setSaving] = React.useState(false);

  // Authorized record (populated after save)
  const [record, setRecord] = React.useState({
    ref: 'มท.0816.3/ว 1234',
    date: '15 เมษายน 2569',
    by: tweaks.adminName,
    at: '15 เม.ย. 2569, 09:42 น.',
    desc: 'ตามระเบียบกระทรวงมหาดไทยว่าด้วยการใช้ LINE เป็นช่องทางการสื่อสารทางราชการ',
  });

  const auditLog = [
    { date: '15 เม.ย. 2569, 09:42 น.', by: 'นายสมศักดิ์ ใจดี (Admin)', action: 'บันทึกการอนุมัติ LINE', ref_: 'มท.0816.3/ว 1234' },
    { date: '01 ม.ค. 2569, 14:10 น.', by: 'นายวิชัย บุญมี (Admin)', action: 'ยกเลิกการอนุมัติ LINE', ref_: null },
    { date: '10 ธ.ค. 2568, 10:00 น.', by: 'นายวิชัย บุญมี (Admin)', action: 'บันทึกการอนุมัติ LINE', ref_: 'มท.0816.3/ว 0981' },
  ];

  React.useEffect(() => {
    window.addEventListener('message', e => {
      if (e.data?.type === '__activate_edit_mode') setShowTweaks(true);
      if (e.data?.type === '__deactivate_edit_mode') setShowTweaks(false);
    });
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
  }, []);

  function handleSave() {
    if (!refNo || !authorizedDate) return;
    setSaving(true);
    setTimeout(() => {
      setSaving(false);
      setRecord({ ref: refNo, date: authorizedDate, by: tweaks.adminName, at: 'เพิ่งบันทึก', desc: description });
      setViewState('authorized');
    }, 1400);
  }

  function handleRevoke() { setViewState('authorized'); }

  const stateBtns = [
    { k: 'unauthorized', label: 'ยังไม่อนุมัติ' },
    { k: 'authorized',   label: 'อนุมัติแล้ว' },
    { k: 'editing',      label: 'กรอกฟอร์ม' },
    { k: 'revokeConfirm', label: 'ยืนยันยกเลิก' },
  ];

  // ── Screen content ──────────────────────────────────────────
  let content;

  // NOT AUTHORIZED — empty state
  if (viewState === 'unauthorized') {
    content = (
      <div style={{ animation: 'fadeIn 0.3s ease both' }}>
        {/* Status banner */}
        <div style={{
          display: 'flex', alignItems: 'center', gap: 14, padding: '16px 20px',
          background: 'var(--gray-50)', border: '1.5px solid var(--gray-200)',
          borderRadius: 10, marginBottom: 24,
        }}>
          <div style={{
            width: 40, height: 40, borderRadius: 10, background: 'var(--gray-100)',
            display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0,
          }}>
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <circle cx="10" cy="10" r="8" stroke="var(--gray-400)" strokeWidth="1.5" fill="none"/>
              <path d="M10 7v5M10 13.5v.5" stroke="var(--gray-400)" strokeWidth="1.5" strokeLinecap="round"/>
            </svg>
          </div>
          <div>
            <div style={{ fontWeight: 600, color: 'var(--gray-700)', fontSize: 14 }}>LINE ยังไม่ได้รับอนุมัติ</div>
            <div style={{ fontSize: 13, color: 'var(--gray-500)', marginTop: 2 }}>
              ประชาชนยังไม่สามารถ opt-in รับการแจ้งเตือนผ่าน LINE ได้
            </div>
          </div>
          <span style={{
            marginLeft: 'auto', padding: '4px 10px', borderRadius: 20,
            background: 'var(--gray-100)', color: 'var(--gray-500)', fontSize: 12, fontWeight: 600,
          }}>ไม่พร้อม</span>
        </div>

        {/* Law info */}
        <div style={{
          background: 'var(--primary-light)', border: '1px solid #bfdbfe',
          borderRadius: 10, padding: '14px 16px', marginBottom: 24,
        }}>
          <div style={{ fontWeight: 600, color: primary, fontSize: 13, marginBottom: 6 }}>📋 ข้อกำหนดทางกฎหมาย</div>
          <p style={{ fontSize: 13, color: 'var(--gray-700)', lineHeight: 1.7 }}>
            ตามระเบียบกระทรวงมหาดไทย อปท. ต้องมีคำสั่งหรือระเบียบรองรับก่อนใช้ LINE
            เป็นช่องทางราชการ เมื่อบันทึกเลขที่คำสั่งแล้ว ประชาชนจึงสามารถเลือกรับ
            การแจ้งเตือนผ่าน LINE ได้
          </p>
        </div>

        {/* CTA */}
        <div style={{
          background: '#fff', border: '1px solid var(--gray-200)', borderRadius: 12,
          padding: '32px 24px', textAlign: 'center',
        }}>
          <div style={{ fontSize: 32, marginBottom: 12 }}>💬</div>
          <div style={{ fontWeight: 600, fontSize: 16, color: 'var(--gray-800)', marginBottom: 8 }}>
            เปิดใช้งาน LINE สำหรับ {tweaks.orgName}
          </div>
          <div style={{ fontSize: 13, color: 'var(--gray-500)', lineHeight: 1.7, marginBottom: 24, maxWidth: 380, margin: '0 auto 24px' }}>
            บันทึกเลขที่คำสั่งอนุมัติเพื่อเปิดให้ประชาชนสามารถ
            รับการแจ้งเตือนบิลและหนังสือราชการผ่าน LINE
          </div>
          <button
            onClick={() => { setViewState('editing'); setRefNo(''); setAuthorizedDate(''); setDescription(''); }}
            style={{
              padding: '10px 24px', borderRadius: 8, background: primary,
              color: '#fff', fontSize: 14, fontWeight: 600,
              boxShadow: `0 2px 8px ${primary}44`,
            }}
          >+ บันทึกการอนุมัติ LINE</button>
        </div>
      </div>
    );
  }

  // AUTHORIZED — detail view
  else if (viewState === 'authorized') {
    content = (
      <div style={{ animation: 'fadeIn 0.3s ease both' }}>
        {/* Status banner — success */}
        <div style={{
          display: 'flex', alignItems: 'center', gap: 14, padding: '16px 20px',
          background: 'var(--success-bg)', border: '1.5px solid var(--success-border)',
          borderRadius: 10, marginBottom: 24,
        }}>
          <div style={{
            width: 40, height: 40, borderRadius: 10, background: '#dcfce7',
            display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0,
            animation: 'checkPop 0.5s cubic-bezier(0.34,1.56,0.64,1) both',
          }}>
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path d="M4 10l5 5 7-8" stroke="var(--success)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
          </div>
          <div>
            <div style={{ fontWeight: 600, color: 'var(--success)', fontSize: 14 }}>LINE ได้รับอนุมัติแล้ว ✓</div>
            <div style={{ fontSize: 13, color: 'var(--gray-600)', marginTop: 2 }}>
              ประชาชนสามารถ opt-in รับการแจ้งเตือนผ่าน LINE ได้
            </div>
          </div>
          <div style={{ marginLeft: 'auto', display: 'flex', gap: 8 }}>
            <span style={{
              padding: '4px 10px', borderRadius: 20,
              background: '#dcfce7', color: 'var(--success)', fontSize: 12, fontWeight: 600,
            }}>พร้อมใช้งาน</span>
            <button
              onClick={() => { setRefNo(record.ref); setAuthorizedDate(record.date); setDescription(record.desc); setViewState('editing'); }}
              style={{
                padding: '4px 12px', borderRadius: 6, border: '1px solid var(--gray-200)',
                background: '#fff', fontSize: 12, color: 'var(--gray-700)', fontWeight: 500,
              }}
            >แก้ไข</button>
          </div>
        </div>

        {/* Record detail */}
        <div style={{
          background: '#fff', border: '1px solid var(--gray-200)',
          borderRadius: 12, overflow: 'hidden', marginBottom: 24,
        }}>
          <div style={{ padding: '14px 20px', borderBottom: '1px solid var(--gray-100)', fontWeight: 600, fontSize: 14, color: 'var(--gray-800)' }}>
            รายละเอียดคำสั่งอนุมัติ
          </div>
          {[
            { label: 'เลขที่คำสั่ง', value: record.ref, mono: true },
            { label: 'วันที่อนุมัติ', value: record.date },
            { label: 'ผู้บันทึก', value: record.by },
            { label: 'บันทึกเมื่อ', value: record.at },
            { label: 'หมายเหตุ', value: record.desc || '—' },
          ].map((row, i, arr) => (
            <div key={i} style={{
              display: 'flex', alignItems: 'flex-start', gap: 16, padding: '12px 20px',
              borderBottom: i < arr.length - 1 ? '1px solid var(--gray-50)' : 'none',
            }}>
              <div style={{ width: 120, flexShrink: 0, fontSize: 13, color: 'var(--gray-500)', paddingTop: 1 }}>{row.label}</div>
              <div style={{
                fontSize: 14, color: 'var(--gray-800)', fontFamily: row.mono ? 'var(--mono)' : 'var(--font)', flex: 1, lineHeight: 1.6,
              }}>{row.value}</div>
            </div>
          ))}
        </div>

        {/* Impact info */}
        <div style={{
          background: 'var(--primary-light)', border: '1px solid #bfdbfe',
          borderRadius: 10, padding: '12px 16px', marginBottom: 24,
          fontSize: 13, color: 'var(--gray-700)', lineHeight: 1.7,
        }}>
          <strong style={{ color: primary }}>ผลของการอนุมัติ:</strong> ประชาชนใน {tweaks.orgName} จะเห็น "LINE toggle"
          ในหน้าตั้งค่าการแจ้งเตือน และสามารถให้ความยินยอมรับการแจ้งเตือนผ่าน LINE ได้
        </div>

        {/* Revoke */}
        <div style={{
          background: 'var(--danger-bg)', border: '1px solid var(--danger-border)',
          borderRadius: 10, padding: '14px 16px', display: 'flex', alignItems: 'center', gap: 16,
        }}>
          <div style={{ flex: 1 }}>
            <div style={{ fontWeight: 600, color: 'var(--danger)', fontSize: 13, marginBottom: 4 }}>⚠️ ยกเลิกการอนุมัติ LINE</div>
            <div style={{ fontSize: 12, color: 'var(--gray-600)', lineHeight: 1.6 }}>
              การยกเลิกจะหยุดส่ง LINE ให้ประชาชนทุกราย<strong>ทันที</strong> และซ่อน LINE toggle ใน Resident App
            </div>
          </div>
          <button
            onClick={() => setViewState('revokeConfirm')}
            style={{
              padding: '8px 16px', borderRadius: 6,
              border: '1.5px solid var(--danger)', background: '#fff',
              color: 'var(--danger)', fontSize: 13, fontWeight: 600, flexShrink: 0,
            }}
          >ยกเลิกการอนุมัติ</button>
        </div>

        {/* Audit log */}
        <div style={{ marginTop: 24 }}>
          <div style={{ fontWeight: 600, fontSize: 14, color: 'var(--gray-700)', marginBottom: 12 }}>ประวัติการเปลี่ยนแปลง</div>
          <div style={{
            background: '#fff', border: '1px solid var(--gray-200)', borderRadius: 10, padding: '16px 20px',
          }}>
            {auditLog.map((a, i) => (
              <AuditRow key={i} {...a} isLast={i === auditLog.length - 1} />
            ))}
          </div>
        </div>
      </div>
    );
  }

  // EDITING — form
  else if (viewState === 'editing') {
    content = (
      <div style={{ animation: 'fadeIn 0.25s ease both' }}>
        <div style={{
          background: 'var(--primary-light)', border: '1px solid #bfdbfe',
          borderRadius: 10, padding: '12px 16px', marginBottom: 24,
          fontSize: 13, color: 'var(--gray-700)', lineHeight: 1.7,
        }}>
          📋 <strong style={{ color: primary }}>ข้อกำหนด:</strong> ตามระเบียบกระทรวงมหาดไทย อปท. ต้องมีคำสั่งรองรับก่อนใช้ LINE เป็นช่องทางราชการ — กรุณากรอกเลขที่คำสั่งให้ถูกต้อง
        </div>

        <div style={{ background: '#fff', border: '1px solid var(--gray-200)', borderRadius: 12, padding: '24px' }}>
          <Field label="เลขที่คำสั่ง / เลขที่หนังสือ" required hint="เช่น มท.0816.3/ว 1234 หรือ คำสั่ง อบต.ท่าขอนยาง ที่ 15/2569">
            <Input value={refNo} onChange={setRefNo} placeholder="มท.0816.3/ว XXXX" mono />
          </Field>
          <Field label="วันที่อนุมัติ" required hint="วันที่ออกคำสั่งหรือหนังสือ">
            <Input value={authorizedDate} onChange={setAuthorizedDate} placeholder="เช่น 15 เมษายน 2569" />
          </Field>
          <Field label="หมายเหตุ / รายละเอียดเพิ่มเติม">
            <textarea
              value={description} onChange={e => setDescription(e.target.value)}
              placeholder="อ้างอิงระเบียบ หรือรายละเอียดเพิ่มเติม (ไม่บังคับ)"
              rows={3}
              style={{
                width: '100%', padding: '9px 12px', border: '1.5px solid var(--gray-200)',
                borderRadius: 'var(--radius)', fontSize: 14, color: 'var(--gray-800)',
                resize: 'vertical', outline: 'none', lineHeight: 1.6,
              }}
              onFocus={e => e.target.style.borderColor = primary}
              onBlur={e => e.target.style.borderColor = 'var(--gray-200)'}
            />
          </Field>

          <div style={{ padding: '16px 0 0', borderTop: '1px solid var(--gray-100)', display: 'flex', gap: 10, justifyContent: 'flex-end' }}>
            <button
              onClick={() => setViewState(record ? 'authorized' : 'unauthorized')}
              style={{
                padding: '9px 20px', borderRadius: 8, border: '1px solid var(--gray-200)',
                background: '#fff', color: 'var(--gray-700)', fontSize: 14, fontWeight: 500,
              }}
            >ยกเลิก</button>
            <button
              onClick={handleSave}
              disabled={!refNo || !authorizedDate || saving}
              style={{
                padding: '9px 24px', borderRadius: 8,
                background: (!refNo || !authorizedDate || saving) ? 'var(--gray-200)' : primary,
                color: (!refNo || !authorizedDate || saving) ? 'var(--gray-400)' : '#fff',
                fontSize: 14, fontWeight: 600,
                display: 'flex', alignItems: 'center', gap: 8,
                transition: 'all 0.15s',
              }}
            >
              {saving && <div style={{ width: 16, height: 16, borderRadius: 8, border: '2px solid #ffffff44', borderTopColor: '#fff', animation: 'spin 0.7s linear infinite' }}/>}
              {saving ? 'กำลังบันทึก...' : 'บันทึกการอนุมัติ'}
            </button>
          </div>
        </div>
      </div>
    );
  }

  // REVOKE CONFIRM
  else if (viewState === 'revokeConfirm') {
    content = (
      <div style={{ animation: 'fadeIn 0.25s ease both' }}>
        <div style={{
          background: '#fff', border: '2px solid var(--danger-border)', borderRadius: 12, padding: '32px 28px', textAlign: 'center',
        }}>
          <div style={{ fontSize: 40, marginBottom: 16 }}>⚠️</div>
          <div style={{ fontSize: 18, fontWeight: 700, color: 'var(--danger)', marginBottom: 12 }}>
            ยืนยันการยกเลิกการอนุมัติ LINE?
          </div>
          <div style={{ fontSize: 14, color: 'var(--gray-600)', lineHeight: 1.7, marginBottom: 24, maxWidth: 440, margin: '0 auto 24px' }}>
            การยกเลิกจะมีผลทันที:
          </div>
          <div style={{
            background: 'var(--danger-bg)', border: '1px solid var(--danger-border)',
            borderRadius: 10, padding: '14px 18px', textAlign: 'left', marginBottom: 28,
          }}>
            {[
              'หยุดส่ง LINE ให้ประชาชนทุกราย ทันที',
              'LINE toggle จะหายจาก Resident App',
              'consent ที่ประชาชนให้ไว้ทั้งหมดจะ inactive',
              'ต้องบันทึกคำสั่งใหม่เพื่อเปิดใช้อีกครั้ง',
            ].map((item, i) => (
              <div key={i} style={{ display: 'flex', gap: 10, fontSize: 13, color: 'var(--danger)', marginBottom: i < 3 ? 8 : 0 }}>
                <span>✕</span><span>{item}</span>
              </div>
            ))}
          </div>
          <div style={{ display: 'flex', gap: 10, justifyContent: 'center' }}>
            <button
              onClick={() => setViewState('authorized')}
              style={{
                padding: '10px 24px', borderRadius: 8, border: '1px solid var(--gray-200)',
                background: '#fff', color: 'var(--gray-700)', fontSize: 14, fontWeight: 500,
              }}
            >ไม่ยกเลิก</button>
            <button
              onClick={handleRevoke}
              style={{
                padding: '10px 24px', borderRadius: 8, background: 'var(--danger)',
                color: '#fff', fontSize: 14, fontWeight: 600,
              }}
            >ยืนยัน ยกเลิกการอนุมัติ</button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div style={{ display: 'flex', height: '100vh', overflow: 'hidden' }}>
      <Sidebar primary={primary} orgName={tweaks.orgName} />

      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
        {/* Header */}
        <div style={{
          height: 'var(--header-h)', background: '#fff', borderBottom: '1px solid var(--gray-200)',
          display: 'flex', alignItems: 'center', padding: '0 24px', gap: 12,
          flexShrink: 0,
        }}>
          <div style={{ fontSize: 13, color: 'var(--gray-400)' }}>ตั้งค่าองค์กร</div>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M4 5l3 3 3-3" stroke="var(--gray-300)" strokeWidth="1.5" fill="none" strokeLinecap="round"/></svg>
          <div style={{ fontSize: 13, color: 'var(--gray-400)' }}>LINE & การแจ้งเตือน</div>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M4 5l3 3 3-3" stroke="var(--gray-300)" strokeWidth="1.5" fill="none" strokeLinecap="round"/></svg>
          <div style={{ fontSize: 13, fontWeight: 600, color: 'var(--gray-800)' }}>อนุมัติ LINE ราชการ</div>
          <div style={{ marginLeft: 'auto', display: 'flex', gap: 8 }}>
            {/* State picker */}
            {stateBtns.map(b => (
              <button key={b.k} onClick={() => setViewState(b.k)} style={{
                padding: '5px 12px', borderRadius: 6, fontSize: 12, fontWeight: 500,
                background: viewState === b.k ? primary : 'var(--gray-100)',
                color: viewState === b.k ? '#fff' : 'var(--gray-600)',
                border: 'none', transition: 'all 0.15s',
              }}>{b.label}</button>
            ))}
          </div>
        </div>

        {/* Main content */}
        <div style={{ flex: 1, overflowY: 'auto', padding: '28px 32px' }}>
          {/* Page title */}
          <div style={{ marginBottom: 24 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 6 }}>
              <div style={{ fontSize: 20, fontWeight: 700, color: 'var(--gray-900)' }}>A-05 การอนุมัติ LINE ราชการ</div>
              <span style={{
                padding: '3px 8px', borderRadius: 6,
                background: 'var(--primary-light)', color: primary,
                fontSize: 11, fontWeight: 600,
              }}>P1</span>
            </div>
            <div style={{ fontSize: 13, color: 'var(--gray-500)', lineHeight: 1.6, maxWidth: 600 }}>
              บันทึกคำสั่ง/ระเบียบที่อนุมัติให้ {tweaks.orgName} ใช้ LINE เป็นช่องทางราชการ —
              เมื่อบันทึกแล้วระบบจึงแสดง LINE toggle ให้ประชาชนในแอป
            </div>
          </div>

          <div style={{ maxWidth: 680 }}>
            {content}
          </div>
        </div>
      </div>

      {/* Tweaks panel */}
      {showTweaks && (
        <div style={{
          position: 'fixed', bottom: 24, right: 24, zIndex: 9999,
          background: '#fff', borderRadius: 12, boxShadow: '0 8px 32px rgba(0,0,0,.18)',
          padding: 20, width: 260, fontFamily: 'var(--font)', fontSize: 13,
        }}>
          <div style={{ fontWeight: 700, fontSize: 14, color: 'var(--gray-800)', marginBottom: 14 }}>Tweaks</div>
          <div style={{ marginBottom: 12 }}>
            <div style={{ fontSize: 12, color: 'var(--gray-500)', marginBottom: 4 }}>Org Primary Color</div>
            <input type="color" value={tweaks.orgPrimary}
              onChange={e => { const t={...tweaks, orgPrimary:e.target.value}; setTweaks(t); document.documentElement.style.setProperty('--primary', e.target.value); window.parent.postMessage({type:'__edit_mode_set_keys',edits:{orgPrimary:e.target.value}},'*'); }}
              style={{ width:'100%', height:36, borderRadius:8, border:'1px solid var(--gray-200)', cursor:'pointer', padding:2 }}
            />
          </div>
          <div style={{ marginBottom: 12 }}>
            <div style={{ fontSize: 12, color: 'var(--gray-500)', marginBottom: 4 }}>ชื่อ อปท.</div>
            <input type="text" value={tweaks.orgName}
              onChange={e => { const t={...tweaks, orgName:e.target.value}; setTweaks(t); window.parent.postMessage({type:'__edit_mode_set_keys',edits:{orgName:e.target.value}},'*'); }}
              style={{ width:'100%', padding:'7px 10px', borderRadius:8, border:'1px solid var(--gray-200)', fontSize:13, fontFamily:'var(--font)' }}
            />
          </div>
          <div>
            <div style={{ fontSize: 12, color: 'var(--gray-500)', marginBottom: 4 }}>ชื่อ Admin</div>
            <input type="text" value={tweaks.adminName}
              onChange={e => { const t={...tweaks, adminName:e.target.value}; setTweaks(t); window.parent.postMessage({type:'__edit_mode_set_keys',edits:{adminName:e.target.value}},'*'); }}
              style={{ width:'100%', padding:'7px 10px', borderRadius:8, border:'1px solid var(--gray-200)', fontSize:13, fontFamily:'var(--font)' }}
            />
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.body.appendChild(Object.assign(document.createElement('div'), {id:'root'}))).render(<A05App />);
</script>
</body>
</html>
