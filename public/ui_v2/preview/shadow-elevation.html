<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'DM Sans',sans-serif; background:#fff; padding:20px; color:#181d26; }
.section { margin-bottom:18px; }
.title { font-size:10px; font-weight:600; letter-spacing:.5px; text-transform:uppercase; color:rgba(4,14,32,.4); margin-bottom:10px; }
.row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.shadow-box { width:88px; height:48px; border-radius:12px; background:#fff; display:flex; align-items:center; justify-content:center; font-size:10px; color:rgba(4,14,32,.55); text-align:center; line-height:1.3; }
.label { font-size:10px; color:rgba(4,14,32,.45); margin-top:4px; text-align:center; }
.pair { display:flex; flex-direction:column; align-items:center; }
</style>
</head><body>
<div class="section">
  <div class="title">Shadow System</div>
  <div class="row">
    <div class="pair">
      <div class="shadow-box" style="box-shadow:none; border:1px solid #e0e2e6">No shadow</div>
      <div class="label">flat</div>
    </div>
    <div class="pair">
      <div class="shadow-box" style="box-shadow:0px 1px 3px rgba(0,0,0,0.08),0px 0px 1px rgba(0,0,0,0.16)">Card</div>
      <div class="label">--shadow-card</div>
    </div>
    <div class="pair">
      <div class="shadow-box" style="box-shadow:rgba(0,0,0,0.32) 0px 0px 1px,rgba(0,0,0,0.08) 0px 0px 2px,rgba(45,127,249,0.28) 0px 1px 3px,rgba(0,0,0,0.06) 0px 0px 0px 0.5px inset">Blue-tinted</div>
      <div class="label">--shadow-blue</div>
    </div>
    <div class="pair">
      <div class="shadow-box" style="box-shadow:rgba(15,48,106,0.05) 0px 0px 20px">Soft ambient</div>
      <div class="label">--shadow-soft</div>
    </div>
    <div class="pair">
      <div class="shadow-box" style="box-shadow:rgba(15,48,106,0.05) 0px 0px 20px,rgba(0,0,0,0.12) 0px 4px 16px">Modal</div>
      <div class="label">--shadow-modal</div>
    </div>
    <div class="pair">
      <div class="shadow-box" style="box-shadow:0 0 0 3px rgba(27,97,201,0.25); border:1.5px solid #1b61c9">Focus ring</div>
      <div class="label">--shadow-focus</div>
    </div>
  </div>
</div>
<div class="section">
  <div class="title">Elevation Layers</div>
  <div style="display:flex; gap:12px; align-items:flex-end">
    <div style="text-align:center">
      <div style="width:56px;height:24px;background:#f8fafc;border:1px solid #e0e2e6;border-radius:4px;margin:0 auto"></div>
      <div style="font-size:10px;color:rgba(4,14,32,.4);margin-top:4px">L0<br>base</div>
    </div>
    <div style="text-align:center">
      <div style="width:56px;height:32px;background:#fff;border-radius:8px;box-shadow:0px 1px 3px rgba(0,0,0,0.08),0px 0px 1px rgba(0,0,0,0.16);margin:0 auto"></div>
      <div style="font-size:10px;color:rgba(4,14,32,.4);margin-top:4px">L1<br>card</div>
    </div>
    <div style="text-align:center">
      <div style="width:56px;height:40px;background:#fff;border-radius:10px;box-shadow:rgba(0,0,0,0.32) 0px 0px 1px,rgba(45,127,249,0.28) 0px 1px 3px;margin:0 auto"></div>
      <div style="font-size:10px;color:rgba(4,14,32,.4);margin-top:4px">L2<br>popover</div>
    </div>
    <div style="text-align:center">
      <div style="width:56px;height:48px;background:#fff;border-radius:12px;box-shadow:rgba(15,48,106,0.05) 0px 0px 20px,rgba(0,0,0,0.12) 0px 4px 16px;margin:0 auto"></div>
      <div style="font-size:10px;color:rgba(4,14,32,.4);margin-top:4px">L3<br>modal</div>
    </div>
  </div>
</div>
</body></html>
