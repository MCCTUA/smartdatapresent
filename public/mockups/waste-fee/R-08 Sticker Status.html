<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>R-08 สถานะสติ๊กเกอร์</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #f0eee9;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
      font-family: 'Noto Sans Thai', -apple-system, system-ui, sans-serif;
    }
    #root { width: 100%; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; }
    button { font-family: 'Noto Sans Thai', -apple-system, system-ui, sans-serif; }
  </style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="../ios-frame.jsx"></script>
<script type="text/babel">

// ─── Tweak defaults ───────────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "orgColor": "#1b61c9",
  "orgName": "อบต.สุขสมบูรณ์",
  "stickerStatus": "received",
  "stickerColor": "#16a34a"
}/*EDITMODE-END*/;

// ─── Sticker year data ────────────────────────────────────────
const FISCAL_YEAR = "2568";
const STICKER_PERIOD = "1 ต.ค. 2567 – 30 ก.ย. 2568";

const YEAR_HISTORY = [
  { year: "2568", color: "#16a34a", label: "เขียว" },
  { year: "2567", color: "#1b61c9", label: "น้ำเงิน" },
  { year: "2566", color: "#ea580c", label: "ส้ม" },
  { year: "2565", color: "#dc2626", label: "แดง" },
];

const STATUS_CONFIG = {
  received: {
    label: "ได้รับสติ๊กเกอร์แล้ว",
    sublabel: "บ้านของคุณผ่านการชำระค่าธรรมเนียมแล้ว",
    badgeColor: "#059669",
    badgeBg: "#ECFDF5",
    badgeText: "✓  ได้รับแล้ว",
  },
  paid_pending: {
    label: "รอรับสติ๊กเกอร์",
    sublabel: "ชำระเงินแล้ว — รอเจ้าหน้าที่นำส่งสติ๊กเกอร์",
    badgeColor: "#D97706",
    badgeBg: "#FFFBEB",
    badgeText: "⏳  รอรับ",
  },
  unpaid: {
    label: "ยังไม่ได้รับสติ๊กเกอร์",
    sublabel: "กรุณาชำระค่าธรรมเนียมเพื่อรับสติ๊กเกอร์ปีนี้",
    badgeColor: "#DC2626",
    badgeBg: "#FEF2F2",
    badgeText: "✗  ยังไม่ชำระ",
  },
};

// ─── Icons ────────────────────────────────────────────────────
function IcChevronLeft({ size = 9, color }) {
  return (
    <svg width={size} height={size * 15/9} viewBox="0 0 9 15" fill="none">
      <path d="M7.5 1L1 7.5L7.5 14" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}
function IcMapPin({ size = 18, color }) {
  return (
    <svg width={size} height={size} viewBox="0 0 18 18" fill="none">
      <path d="M9 1.5C6.1 1.5 3.75 3.85 3.75 6.75c0 4.125 5.25 9.75 5.25 9.75s5.25-5.625 5.25-9.75C14.25 3.85 11.9 1.5 9 1.5Z" stroke={color} strokeWidth="1.5" strokeLinejoin="round"/>
      <circle cx="9" cy="6.75" r="1.75" stroke={color} strokeWidth="1.5"/>
    </svg>
  );
}
function IcCalendar({ size = 18, color }) {
  return (
    <svg width={size} height={size} viewBox="0 0 18 18" fill="none">
      <rect x="1.5" y="3" width="15" height="13.5" rx="2.5" stroke={color} strokeWidth="1.5"/>
      <path d="M1.5 7.5h15" stroke={color} strokeWidth="1.5"/>
      <path d="M5.25 1.5v3M12.75 1.5v3" stroke={color} strokeWidth="1.5" strokeLinecap="round"/>
      <rect x="5" y="10" width="2.5" height="2.5" rx="0.6" fill={color} fillOpacity="0.6"/>
      <rect x="10.5" y="10" width="2.5" height="2.5" rx="0.6" fill={color} fillOpacity="0.6"/>
    </svg>
  );
}
function IcInfo({ size = 18, color }) {
  return (
    <svg width={size} height={size} viewBox="0 0 18 18" fill="none">
      <circle cx="9" cy="9" r="7.5" stroke={color} strokeWidth="1.5"/>
      <path d="M9 8.25v4.5" stroke={color} strokeWidth="1.8" strokeLinecap="round"/>
      <circle cx="9" cy="5.5" r="0.9" fill={color}/>
    </svg>
  );
}
function IcWalk({ size = 18, color }) {
  return (
    <svg width={size} height={size} viewBox="0 0 18 18" fill="none">
      <circle cx="9" cy="3" r="1.5" stroke={color} strokeWidth="1.4"/>
      <path d="M6 7l3-1.5 3 1.5M7.5 10.5L6 15M10.5 10.5L12 15" stroke={color} strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
      <path d="M7.5 10.5l3 0" stroke={color} strokeWidth="1.4" strokeLinecap="round"/>
    </svg>
  );
}
function IcCreditCard({ size = 18, color }) {
  return (
    <svg width={size} height={size} viewBox="0 0 18 18" fill="none">
      <rect x="1.5" y="3.75" width="15" height="10.5" rx="2.5" stroke={color} strokeWidth="1.5"/>
      <path d="M1.5 7.5h15" stroke={color} strokeWidth="1.5"/>
      <rect x="3.5" y="10" width="4" height="2" rx="0.8" fill={color} fillOpacity="0.6"/>
    </svg>
  );
}
function IcChevronRight({ size = 14, color }) {
  return (
    <svg width={size} height={size} viewBox="0 0 14 14" fill="none">
      <path d="M5 3l4 4-4 4" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

// ─── Big Sticker Graphic ───────────────────────────────────────
function StickerGraphic({ stickerColor, status, size = 200 }) {
  const cfg = STATUS_CONFIG[status];
  const isPaid = status === 'received';
  const isUnpaid = status === 'unpaid';
  const alpha = isUnpaid ? 0.18 : 1;

  // hsl lightened version for inner ring
  const light = stickerColor + '30';
  const mid   = stickerColor + '60';

  return (
    <div style={{ position: 'relative', width: size, height: size, margin: '0 auto' }}>
      {/* Glow */}
      {!isUnpaid && (
        <div style={{
          position: 'absolute', inset: -20,
          borderRadius: '50%',
          background: `radial-gradient(circle, ${stickerColor}22 0%, transparent 70%)`,
          pointerEvents: 'none',
        }}/>
      )}

      {/* Outer ring - dashed for unpaid */}
      <svg width={size} height={size} viewBox="0 0 200 200" style={{ position: 'absolute', inset: 0 }}>
        <circle
          cx="100" cy="100" r="96"
          fill="none"
          stroke={isUnpaid ? '#d1d5db' : stickerColor}
          strokeWidth={isUnpaid ? '2' : '3'}
          strokeDasharray={isUnpaid ? "8 6" : "none"}
          opacity={isUnpaid ? 0.5 : 0.25}
        />
        {/* Decorative ring marks */}
        {!isUnpaid && Array.from({ length: 24 }).map((_, i) => {
          const angle = (i * 15) * Math.PI / 180;
          const r1 = 84, r2 = 91;
          return (
            <line key={i}
              x1={100 + r1 * Math.cos(angle)} y1={100 + r1 * Math.sin(angle)}
              x2={100 + r2 * Math.cos(angle)} y2={100 + r2 * Math.sin(angle)}
              stroke={stickerColor} strokeWidth="1.5" opacity="0.35"
            />
          );
        })}
      </svg>

      {/* Main sticker body */}
      <div style={{
        position: 'absolute',
        inset: 12,
        borderRadius: '50%',
        background: isUnpaid
          ? 'linear-gradient(145deg, #f3f4f6 0%, #e5e7eb 100%)'
          : `linear-gradient(145deg, ${stickerColor} 0%, ${stickerColor}cc 100%)`,
        boxShadow: isUnpaid
          ? 'inset 0 2px 8px rgba(0,0,0,0.08)'
          : `0 12px 40px ${stickerColor}50, inset 0 1px 0 rgba(255,255,255,0.25)`,
        display: 'flex',
        flexDirection: 'column',
        alignItems: 'center',
        justifyContent: 'center',
        gap: 6,
        transition: 'all 0.4s ease',
      }}>
        {/* Inner circle detail */}
        <div style={{
          position: 'absolute',
          inset: 14,
          borderRadius: '50%',
          border: isUnpaid ? '1.5px dashed #9ca3af' : `1.5px solid rgba(255,255,255,0.25)`,
          pointerEvents: 'none',
        }}/>

        {/* Year label */}
        <div style={{
          fontSize: 13,
          fontWeight: 600,
          color: isUnpaid ? '#9ca3af' : 'rgba(255,255,255,0.75)',
          letterSpacing: 1.5,
          textTransform: 'uppercase',
          lineHeight: 1,
        }}>
          ปี {FISCAL_YEAR}
        </div>

        {/* Big status icon */}
        {isPaid ? (
          <svg width="58" height="58" viewBox="0 0 58 58" fill="none">
            <path d="M12 30L24 42L46 18" stroke="white" strokeWidth="5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        ) : status === 'paid_pending' ? (
          <svg width="52" height="52" viewBox="0 0 52 52" fill="none">
            <circle cx="26" cy="26" r="18" stroke="rgba(255,255,255,0.85)" strokeWidth="3"/>
            <path d="M26 16v11l7 5" stroke="rgba(255,255,255,0.85)" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        ) : (
          <svg width="52" height="52" viewBox="0 0 52 52" fill="none">
            <circle cx="26" cy="26" r="18" stroke="#9ca3af" strokeWidth="2.5"/>
            <path d="M26 18v11" stroke="#9ca3af" strokeWidth="3" strokeLinecap="round"/>
            <circle cx="26" cy="35" r="2" fill="#9ca3af"/>
          </svg>
        )}

        {/* Org name arc hint */}
        <div style={{
          fontSize: 11,
          fontWeight: 500,
          color: isUnpaid ? '#9ca3af' : 'rgba(255,255,255,0.6)',
          letterSpacing: 0.8,
          lineHeight: 1,
        }}>
          {isUnpaid ? 'ยังไม่ชำระ' : status === 'paid_pending' ? 'รอรับสติ๊กเกอร์' : 'ชำระแล้ว'}
        </div>
      </div>
    </div>
  );
}

// ─── Status Badge ─────────────────────────────────────────────
function StatusBadge({ status }) {
  const cfg = STATUS_CONFIG[status];
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center',
      padding: '5px 13px', borderRadius: 20,
      background: cfg.badgeBg,
      color: cfg.badgeColor,
      fontSize: 13, fontWeight: 600,
      letterSpacing: 0.2,
    }}>
      {cfg.badgeText}
    </span>
  );
}

// ─── Info Row ─────────────────────────────────────────────────
function InfoRow({ icon, label, value, last }) {
  return (
    <div style={{
      display: 'flex', alignItems: 'center', gap: 12,
      padding: '13px 0',
      borderBottom: last ? 'none' : '0.5px solid #f0f0f5',
    }}>
      <div style={{ flexShrink: 0, opacity: 0.55 }}>{icon}</div>
      <div style={{ flex: 1 }}>
        <div style={{ fontSize: 12, color: 'rgba(60,60,67,0.45)', marginBottom: 2, fontWeight: 500 }}>{label}</div>
        <div style={{ fontSize: 14, color: '#181d26', fontWeight: 500, lineHeight: 1.4 }}>{value}</div>
      </div>
    </div>
  );
}

// ─── Pickup Info Card ─────────────────────────────────────────
function PickupCard({ status, orgColor }) {
  if (status === 'unpaid') return null;

  const items = status === 'received'
    ? [
        { icon: <IcCalendar size={18} color="#6b7280"/>, label: "วันที่รับสติ๊กเกอร์", value: "12 มกราคม 2568" },
        { icon: <IcMapPin size={18} color="#6b7280"/>,    label: "สถานที่",             value: "สำนักงาน อบต.สุขสมบูรณ์ ชั้น 1" },
        { icon: <IcWalk size={18} color="#6b7280"/>,      label: "รับโดย",              value: "เจ้าหน้าที่นำส่งถึงบ้าน" },
      ]
    : [
        { icon: <IcCalendar size={18} color="#6b7280"/>, label: "คาดว่าจะได้รับ",       value: "ภายใน 7 วันทำการ" },
        { icon: <IcMapPin size={18} color="#6b7280"/>,    label: "หรือรับด้วยตัวเองที่", value: "สำนักงาน อบต.สุขสมบูรณ์ ชั้น 1\nจ.–ศ.  08:30–16:30 น." },
        { icon: <IcInfo size={18} color="#6b7280"/>,      label: "หมายเหตุ",             value: "กรุณานำบัตรประชาชนมาแสดง" },
      ];

  return (
    <div style={{
      margin: '0 16px 16px',
      background: 'white', borderRadius: 20,
      boxShadow: '0 1px 4px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04)',
      overflow: 'hidden',
    }}>
      <div style={{
        padding: '14px 16px 0',
        fontSize: 12, fontWeight: 600, color: 'rgba(60,60,67,0.45)',
        letterSpacing: 0.6, textTransform: 'uppercase',
      }}>
        {status === 'received' ? 'ข้อมูลการรับสติ๊กเกอร์' : 'วิธีรับสติ๊กเกอร์'}
      </div>
      <div style={{ padding: '0 16px 4px' }}>
        {items.map((it, i) => (
          <InfoRow key={i} icon={it.icon} label={it.label} value={it.value} last={i === items.length - 1}/>
        ))}
      </div>
    </div>
  );
}

// ─── Year History ─────────────────────────────────────────────
function YearHistory({ currentColor }) {
  return (
    <div style={{
      margin: '0 16px 16px',
      background: 'white', borderRadius: 20,
      boxShadow: '0 1px 4px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04)',
      overflow: 'hidden',
    }}>
      <div style={{
        padding: '14px 16px 10px',
        fontSize: 12, fontWeight: 600, color: 'rgba(60,60,67,0.45)',
        letterSpacing: 0.6, textTransform: 'uppercase',
      }}>สีสติ๊กเกอร์ประจำปี</div>
      <div style={{ padding: '0 16px 14px', display: 'flex', gap: 10 }}>
        {YEAR_HISTORY.map((y, i) => {
          const isCurrent = i === 0;
          return (
            <div key={y.year} style={{
              flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6,
            }}>
              <div style={{
                width: 44, height: 44, borderRadius: '50%',
                background: y.color,
                boxShadow: isCurrent ? `0 4px 12px ${y.color}60` : 'none',
                border: isCurrent ? `3px solid white` : '2px solid transparent',
                outline: isCurrent ? `2px solid ${y.color}` : 'none',
                opacity: isCurrent ? 1 : 0.45,
                transition: 'all 0.2s',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
              }}>
                {isCurrent && (
                  <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                    <path d="M4 9.5L7.5 13L14 6" stroke="white" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/>
                  </svg>
                )}
              </div>
              <div style={{ fontSize: 11, color: isCurrent ? '#181d26' : 'rgba(60,60,67,0.4)', fontWeight: isCurrent ? 600 : 400, textAlign: 'center', lineHeight: 1.3 }}>
                <div>{y.year}</div>
                <div>{y.label}</div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── CTA (Unpaid) ─────────────────────────────────────────────
function UnpaidCTA({ orgColor }) {
  return (
    <div style={{ margin: '0 16px 16px', display: 'flex', flexDirection: 'column', gap: 10 }}>
      {/* Warning banner */}
      <div style={{
        background: '#FEF2F2', border: '1px solid #fecaca',
        borderRadius: 16, padding: '14px 16px',
        display: 'flex', gap: 10, alignItems: 'flex-start',
      }}>
        <IcInfo size={18} color="#DC2626"/>
        <div>
          <div style={{ fontSize: 13, fontWeight: 600, color: '#DC2626', marginBottom: 3 }}>บ้านของคุณยังไม่มีสติ๊กเกอร์</div>
          <div style={{ fontSize: 12, color: '#b91c1c', lineHeight: 1.6 }}>
            สติ๊กเกอร์แสดงว่าท่านได้ชำระค่าธรรมเนียมแล้ว — รถเก็บขยะอาจข้ามบ้านที่ไม่มีสติ๊กเกอร์ถูกต้อง
          </div>
        </div>
      </div>
      {/* How-to info */}
      <div style={{
        background: 'white', borderRadius: 16,
        boxShadow: '0 1px 4px rgba(0,0,0,0.06)',
        overflow: 'hidden',
      }}>
        <div style={{ padding: '14px 16px 0', fontSize: 12, fontWeight: 600, color: 'rgba(60,60,67,0.45)', letterSpacing: 0.6, textTransform: 'uppercase' }}>
          ขั้นตอนรับสติ๊กเกอร์
        </div>
        {[
          { n: "1", t: "ชำระค่าธรรมเนียม", d: "ผ่านแอป QR Code หรือ ณ สำนักงาน" },
          { n: "2", t: "รับใบเสร็จ", d: "ทางแอปหรือรับที่สำนักงาน" },
          { n: "3", t: "รับสติ๊กเกอร์", d: "เจ้าหน้าที่นำส่ง หรือรับที่สำนักงาน" },
        ].map((s, i) => (
          <div key={i} style={{
            display: 'flex', gap: 12, alignItems: 'flex-start',
            padding: '12px 16px',
            borderBottom: i < 2 ? '0.5px solid #f0f0f5' : 'none',
          }}>
            <div style={{
              width: 26, height: 26, borderRadius: '50%', flexShrink: 0,
              background: `${orgColor}15`,
              color: orgColor, fontSize: 13, fontWeight: 700,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              marginTop: 1,
            }}>{s.n}</div>
            <div>
              <div style={{ fontSize: 14, fontWeight: 600, color: '#181d26', marginBottom: 2 }}>{s.t}</div>
              <div style={{ fontSize: 12, color: 'rgba(60,60,67,0.5)', lineHeight: 1.5 }}>{s.d}</div>
            </div>
          </div>
        ))}
      </div>
      {/* Pay button */}
      <button style={{
        width: '100%', height: 52, borderRadius: 16,
        background: orgColor, border: 'none',
        color: 'white', fontSize: 16, fontWeight: 700,
        cursor: 'pointer',
        boxShadow: `0 6px 20px ${orgColor}45`,
        letterSpacing: 0.3,
      }}>
        ชำระเงินเพื่อรับสติ๊กเกอร์
      </button>
    </div>
  );
}

// ─── Toast ────────────────────────────────────────────────────
function Toast({ message }) {
  return (
    <div style={{
      position: 'absolute', bottom: 56, left: 20, right: 20, zIndex: 100,
      background: 'rgba(24,29,38,0.88)', color: 'white',
      padding: '12px 16px', borderRadius: 12,
      fontSize: 14, textAlign: 'center',
      backdropFilter: 'blur(12px)',
      boxShadow: '0 4px 16px rgba(0,0,0,0.25)',
    }}>
      {message}
    </div>
  );
}

// ─── Main Screen ──────────────────────────────────────────────
function StickerStatusScreen({ orgColor, orgName, stickerStatus, stickerColor }) {
  const [toast, setToast] = React.useState(null);
  const cfg = STATUS_CONFIG[stickerStatus];

  const showToast = msg => {
    setToast(msg);
    setTimeout(() => setToast(null), 2400);
  };

  return (
    <div style={{
      fontFamily: "'Noto Sans Thai', -apple-system, system-ui, sans-serif",
      height: '100%', display: 'flex', flexDirection: 'column',
      background: '#F2F2F7', position: 'relative',
    }}>
      {/* Status bar spacer */}
      <div style={{ height: 62, flexShrink: 0 }}/>

      {/* Nav bar */}
      <div style={{ display: 'flex', alignItems: 'center', padding: '4px 16px 12px' }}>
        <button style={{
          background: 'none', border: 'none', cursor: 'pointer',
          display: 'flex', alignItems: 'center', gap: 5,
          color: orgColor, fontSize: 16, padding: '4px 0',
        }}>
          <IcChevronLeft size={9} color={orgColor}/>
          กลับ
        </button>
        <div style={{ flex: 1, textAlign: 'center', fontSize: 17, fontWeight: 600, color: '#181d26' }}>
          สถานะสติ๊กเกอร์
        </div>
        <div style={{ width: 52 }}/>
      </div>

      {/* Scrollable body */}
      <div style={{ flex: 1, overflowY: 'auto', paddingBottom: 44 }}>

        {/* Hero sticker section */}
        <div style={{
          margin: '4px 16px 20px',
          background: 'white', borderRadius: 28,
          boxShadow: '0 1px 4px rgba(0,0,0,0.06), 0 2px 8px rgba(0,0,0,0.04)',
          padding: '32px 20px 28px',
          display: 'flex', flexDirection: 'column', alignItems: 'center',
          gap: 20,
          overflow: 'hidden',
          position: 'relative',
        }}>
          {/* Subtle bg tint */}
          <div style={{
            position: 'absolute', inset: 0,
            background: stickerStatus === 'unpaid'
              ? 'none'
              : `radial-gradient(ellipse at 50% 0%, ${stickerColor}0a 0%, transparent 60%)`,
            pointerEvents: 'none',
          }}/>

          <StickerGraphic stickerColor={stickerColor} status={stickerStatus} size={196}/>

          {/* Status info */}
          <div style={{ textAlign: 'center', position: 'relative' }}>
            <div style={{ fontSize: 20, fontWeight: 700, color: '#181d26', marginBottom: 8, lineHeight: 1.3 }}>
              {cfg.label}
            </div>
            <div style={{ fontSize: 14, color: 'rgba(60,60,67,0.5)', lineHeight: 1.6, marginBottom: 14, maxWidth: 240 }}>
              {cfg.sublabel}
            </div>
            <StatusBadge status={stickerStatus}/>
          </div>

          {/* Period strip */}
          <div style={{
            width: '100%',
            background: stickerStatus === 'unpaid' ? '#f9fafb' : `${stickerColor}10`,
            border: `1px solid ${stickerStatus === 'unpaid' ? '#e5e7eb' : stickerColor + '20'}`,
            borderRadius: 14, padding: '11px 16px',
            display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7,
          }}>
            <IcCalendar size={15} color={stickerStatus === 'unpaid' ? '#9ca3af' : stickerColor}/>
            <span style={{
              fontSize: 13, fontWeight: 500,
              color: stickerStatus === 'unpaid' ? '#9ca3af' : stickerColor,
            }}>
              ระยะเวลา {STICKER_PERIOD}
            </span>
          </div>
        </div>

        {/* Pickup info or unpaid CTA */}
        {stickerStatus === 'unpaid' ? (
          <UnpaidCTA orgColor={orgColor}/>
        ) : (
          <PickupCard status={stickerStatus} orgColor={orgColor}/>
        )}

        {/* Year history */}
        <YearHistory currentColor={stickerColor}/>

        {/* Info link row */}
        <div style={{ margin: '0 16px 16px' }}>
          <button onClick={() => showToast("เปิดข้อมูลเพิ่มเติม...")} style={{
            width: '100%', background: 'white', border: 'none',
            borderRadius: 16, padding: '14px 16px',
            display: 'flex', alignItems: 'center', justifyContent: 'space-between',
            cursor: 'pointer',
            boxShadow: '0 1px 4px rgba(0,0,0,0.06)',
          }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
              <IcInfo size={18} color={orgColor}/>
              <span style={{ fontSize: 14, color: '#181d26', fontWeight: 500 }}>ระบบสติ๊กเกอร์คืออะไร?</span>
            </div>
            <IcChevronRight size={14} color="rgba(60,60,67,0.3)"/>
          </button>
        </div>

      </div>

      {toast && <Toast message={toast}/>}
    </div>
  );
}

// ─── Tweaks Panel ─────────────────────────────────────────────
const tweaksPanelSt = {
  overlay: {
    position: 'fixed', inset: 0, zIndex: 9999,
    display: 'flex', alignItems: 'flex-end', justifyContent: 'center',
    background: 'rgba(0,0,0,0.45)', backdropFilter: 'blur(4px)',
  },
  panel: {
    background: 'white', borderRadius: '22px 22px 0 0',
    padding: '16px 20px 40px', width: '100%', maxWidth: 500,
    boxShadow: '0 -4px 28px rgba(0,0,0,0.14)',
  },
  label: {
    display: 'block', fontSize: 12, color: 'rgba(60,60,67,0.55)',
    marginBottom: 10, fontWeight: 600, letterSpacing: 0.5, textTransform: 'uppercase',
  },
};

const STICKER_COLORS = [
  { color: "#16a34a", label: "เขียว" },
  { color: "#1b61c9", label: "น้ำเงิน" },
  { color: "#ea580c", label: "ส้ม" },
  { color: "#dc2626", label: "แดง" },
  { color: "#7c3aed", label: "ม่วง" },
  { color: "#0891b2", label: "ฟ้า" },
  { color: "#d97706", label: "เหลือง" },
];
const ORG_COLORS = ["#1b61c9","#DC2626","#059669","#D97706","#7C3AED","#DB2777","#0891B2"];

function TweaksPanel({ tweaks, onChange, onClose }) {
  return (
    <div style={tweaksPanelSt.overlay} onClick={onClose}>
      <div style={tweaksPanelSt.panel} onClick={e => e.stopPropagation()}>
        <div style={{ display: 'flex', justifyContent: 'center', marginBottom: 18 }}>
          <div style={{ width: 36, height: 4, borderRadius: 2, background: 'rgba(60,60,67,0.2)' }}/>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 24 }}>
          <span style={{ fontSize: 17, fontWeight: 600, color: '#181d26' }}>Tweaks</span>
          <button onClick={onClose} style={{ background: '#f0f0f5', border: 'none', width: 28, height: 28, borderRadius: 8, cursor: 'pointer', fontSize: 14, color: '#666', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>✕</button>
        </div>

        {/* Sticker Status */}
        <div style={{ marginBottom: 24 }}>
          <label style={tweaksPanelSt.label}>สถานะสติ๊กเกอร์</label>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            {[
              ["received",     "ได้รับสติ๊กเกอร์แล้ว",   "#059669"],
              ["paid_pending", "จ่ายแล้ว รอรับ",         "#D97706"],
              ["unpaid",       "ยังไม่ชำระ",              "#DC2626"],
            ].map(([v, l, c]) => (
              <button key={v} onClick={() => onChange('stickerStatus', v)} style={{
                padding: '11px 14px', borderRadius: 12, border: 'none', textAlign: 'left',
                background: tweaks.stickerStatus === v ? `${c}15` : '#f0f0f5',
                cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'space-between',
              }}>
                <span style={{ fontSize: 14, fontWeight: 500, color: tweaks.stickerStatus === v ? c : '#444' }}>{l}</span>
                {tweaks.stickerStatus === v && (
                  <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M3 8.5L6.5 12L13 5" stroke={c} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
                  </svg>
                )}
              </button>
            ))}
          </div>
        </div>

        {/* Sticker Color */}
        <div style={{ marginBottom: 24 }}>
          <label style={tweaksPanelSt.label}>สีสติ๊กเกอร์ปีนี้</label>
          <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', alignItems: 'center' }}>
            {STICKER_COLORS.map(({ color, label }) => (
              <div key={color} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4 }}>
                <button onClick={() => onChange('stickerColor', color)} style={{
                  width: 36, height: 36, borderRadius: 10, background: color, border: 'none', cursor: 'pointer',
                  boxShadow: tweaks.stickerColor === color ? `0 0 0 3px white, 0 0 0 5px ${color}` : 'none',
                  transition: 'box-shadow 0.15s',
                }}/>
                <span style={{ fontSize: 10, color: 'rgba(60,60,67,0.45)', fontWeight: 500 }}>{label}</span>
              </div>
            ))}
            <input type="color" value={tweaks.stickerColor}
              onChange={e => onChange('stickerColor', e.target.value)}
              style={{ width: 36, height: 36, borderRadius: 10, border: '1.5px solid #e0e2e6', cursor: 'pointer', padding: 2 }}
            />
          </div>
        </div>

        {/* Org Color */}
        <div style={{ marginBottom: 0 }}>
          <label style={tweaksPanelSt.label}>สี อปท. (Org Color)</label>
          <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', alignItems: 'center' }}>
            {ORG_COLORS.map(c => (
              <button key={c} onClick={() => onChange('orgColor', c)} style={{
                width: 34, height: 34, borderRadius: 10, background: c, border: 'none', cursor: 'pointer',
                boxShadow: tweaks.orgColor === c ? `0 0 0 3px white, 0 0 0 5px ${c}` : 'none',
                transition: 'box-shadow 0.15s',
              }}/>
            ))}
            <input type="color" value={tweaks.orgColor}
              onChange={e => onChange('orgColor', e.target.value)}
              style={{ width: 34, height: 34, borderRadius: 10, border: '1.5px solid #e0e2e6', cursor: 'pointer', padding: 2 }}
            />
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── App ──────────────────────────────────────────────────────
function App() {
  const [tweaks, setTweaks] = React.useState(() => {
    try {
      const saved = localStorage.getItem('r08-tweaks');
      return saved ? { ...TWEAK_DEFAULTS, ...JSON.parse(saved) } : TWEAK_DEFAULTS;
    } catch { return TWEAK_DEFAULTS; }
  });
  const [showTweaks, setShowTweaks] = React.useState(false);

  const handleChange = (key, val) => {
    const next = { ...tweaks, [key]: val };
    setTweaks(next);
    localStorage.setItem('r08-tweaks', JSON.stringify(next));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: val } }, '*');
  };

  React.useEffect(() => {
    const handler = e => {
      if (e.data?.type === '__activate_edit_mode')   setShowTweaks(true);
      if (e.data?.type === '__deactivate_edit_mode') setShowTweaks(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  return (
    <>
      <IOSDevice width={393} height={852}>
        <StickerStatusScreen
          orgColor={tweaks.orgColor}
          orgName={tweaks.orgName}
          stickerStatus={tweaks.stickerStatus}
          stickerColor={tweaks.stickerColor}
        />
      </IOSDevice>
      {showTweaks && (
        <TweaksPanel tweaks={tweaks} onChange={handleChange} onClose={() => setShowTweaks(false)}/>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
