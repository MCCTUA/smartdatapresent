<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'DM Sans',sans-serif; background:#fff; padding:20px; }
.swatches { display:flex; gap:10px; flex-wrap:wrap; }
.swatch { display:flex; flex-direction:column; gap:6px; }
.chip { width:80px; height:56px; border-radius:10px; }
.label { font-size:11px; color:#181d26; font-weight:500; letter-spacing:.3px; }
.hex { font-size:10px; color:rgba(4,14,32,.55); letter-spacing:.2px; }
.section-title { font-size:11px; font-weight:600; letter-spacing:.5px; color:rgba(4,14,32,.45); text-transform:uppercase; margin-bottom:10px; margin-top:16px; }
</style>
</head><body>
<div class="section-title">Primary</div>
<div class="swatches">
  <div class="swatch"><div class="chip" style="background:#181d26"></div><div class="label">Deep Navy</div><div class="hex">#181d26</div></div>
  <div class="swatch"><div class="chip" style="background:#1b61c9"></div><div class="label">Airtable Blue</div><div class="hex">#1b61c9</div></div>
  <div class="swatch"><div class="chip" style="background:#1550b0"></div><div class="label">Blue Hover</div><div class="hex">#1550b0</div></div>
  <div class="swatch"><div class="chip" style="background:#254fad"></div><div class="label">Blue Mid</div><div class="hex">#254fad</div></div>
  <div class="swatch"><div class="chip" style="background:#dbeafe; border:1px solid #e0e2e6"></div><div class="label">Blue Light</div><div class="hex">#dbeafe</div></div>
  <div class="swatch"><div class="chip" style="background:#eff6ff; border:1px solid #e0e2e6"></div><div class="label">Blue Tint</div><div class="hex">#eff6ff</div></div>
  <div class="swatch"><div class="chip" style="background:#fff; border:1px solid #e0e2e6"></div><div class="label">White</div><div class="hex">#ffffff</div></div>
  <div class="swatch"><div class="chip" style="background:rgba(249,252,255,0.97); border:1px solid #e0e2e6"></div><div class="label">Spotlight</div><div class="hex">rgba(249,252,255,.97)</div></div>
</div>
</body></html>
