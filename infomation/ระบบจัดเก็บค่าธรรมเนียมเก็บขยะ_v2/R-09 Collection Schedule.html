// ─── Tweak defaults ───────────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "orgColor": "#1b61c9",
  "orgName": "อบต.สุขสมบูรณ์",
  "scheduleState": "has_schedule",
  "collectionType": "door_to_door"
}/*EDITMODE-END*/;

// ─── Static data ──────────────────────────────────────────────
const ZONE_DATA = {
  zoneName: "โซน A",
  zoneDetail: "หมู่ที่ 1, 2, 3",
  routeName: "เส้นทาง 1",
  timeWindow: "06:00 – 09:00 น.",
  collectionDays: [1, 3, 5], // Mon=1 Wed=3 Fri=5 (0=Sun)
  collectionDayLabels: ["จ.", "อ.", "พ.", "พฤ.", "ศ.", "ส.", "อา."],
};

// Compute next 4 upcoming collection dates from today
function getUpcomingDates(days) {
  const results = [];
  const today = new Date(2026, 3, 21); // April 21 2026 = Tuesday = day 2
  let d = new Date(today);
  let count = 0;
  while (count < 4) {
    const dow = d.getDay() === 0 ? 6 : d.getDay() - 1; // Mon=0...Sun=6
    const schemaDow = d.getDay(); // Sun=0...Sat=6
    if (days.includes(schemaDow)) {
      results.push(new Date(d));
      count++;
    }
    d.setDate(d.getDate() + 1);
  }
  return results;
}

const THAI_MONTHS = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const THAI_DAYS_FULL = ["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"];

function formatThaiDate(d) {
  return `${d.getDate()} ${THAI_MONTHS[d.getMonth()]} ${d.getFullYear() + 543}`;
}
function formatThaiDayShort(d) {
  return ["อา.","จ.","อ.","พ.","พฤ.","ศ.","ส."][d.getDay()];
}

// ─── Info Row ─────────────────────────────────────────────────

// ─── Day pills week row ───────────────────────────────────────
function WeekRow({ activeDays, orgColor }) {
  // activeDays: array of JS getDay() values (0=Sun...6=Sat)
  const labels = ["อา.", "จ.", "อ.", "พ.", "พฤ.", "ศ.", "ส."];
  return (
    <div style={{ display: 'flex', gap: 6, justifyContent: 'center' }}>
      {labels.map((label, i) => {
        const active = activeDays.includes(i);
        return (
          <div key={i} style={{
            flex: 1, height: 44,
            borderRadius: 12,
            background: active ? orgColor : `${orgColor}0d`,
            border: active ? 'none' : `1px solid ${orgColor}18`,
            display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
            gap: 3,
            boxShadow: active ? `0 3px 10px ${orgColor}35` : 'none',
            transition: 'all 0.2s',
          }}>
            <span style={{
              fontSize: 12, fontWeight: active ? 700 : 500,
              color: active ? 'white' : `${orgColor}60`,
              lineHeight: 1,
            }}>{label}</span>
            {active && (
              <div style={{ width: 4, height: 4, borderRadius: '50%', background: 'rgba(255,255,255,0.7)' }}/>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ─── Upcoming dates list ──────────────────────────────────────
function UpcomingDates({ dates, orgColor }) {
  const today = new Date(2026, 3, 21);
  const todayStr = today.toDateString();

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 0 }}>
      {dates.map((d, i) => {
        const isToday = d.toDateString() === todayStr;
        const dayName = THAI_DAYS_FULL[d.getDay()];
        const dateStr = formatThaiDate(d);
        const isFirst = i === 0;
        return (
          <div key={i} style={{
            display: 'flex', alignItems: 'center', gap: 12,
            padding: '11px 0',
            borderBottom: i < dates.length - 1 ? '0.5px solid #f0f0f5' : 'none',
          }}>
            {/* Day number bubble */}
            <div style={{
              width: 40, height: 40, borderRadius: 12, flexShrink: 0,
              background: isFirst ? orgColor : `${orgColor}10`,
              display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
              boxShadow: isFirst ? `0 3px 10px ${orgColor}30` : 'none',
            }}>
              <span style={{ fontSize: 16, fontWeight: 700, color: isFirst ? 'white' : orgColor, lineHeight: 1 }}>
                {d.getDate()}
              </span>
              <span style={{ fontSize: 10, fontWeight: 500, color: isFirst ? 'rgba(255,255,255,0.75)' : `${orgColor}80`, lineHeight: 1 }}>
                {THAI_MONTHS[d.getMonth()]}
              </span>
            </div>
            <div style={{ flex: 1 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 2 }}>
                <span style={{ fontSize: 14, fontWeight: 600, color: '#181d26' }}>
                  วัน{dayName}
                </span>
                {isFirst && (
                  <span style={{
                    fontSize: 11, fontWeight: 600, color: orgColor,
                    background: `${orgColor}15`, borderRadius: 8, padding: '2px 7px',
                  }}>ถัดไป</span>
                )}
              </div>
              <span style={{ fontSize: 12, color: 'rgba(60,60,67,0.45)', fontWeight: 500 }}>
                {dateStr}
              </span>
            </div>
            {/* Time pill */}
            <div style={{
              background: isFirst ? `${orgColor}12` : '#f5f5f7',
              borderRadius: 10, padding: '5px 10px',
              display: 'flex', alignItems: 'center', gap: 4,
            }}>
              <IcClock size={12} color={isFirst ? orgColor : '#9ca3af'}/>
              <span style={{ fontSize: 11, fontWeight: 600, color: isFirst ? orgColor : '#9ca3af' }}>
                06:00–09:00
              </span>
            </div>
          </div>
        );
      })}
    </div>
  );
}

          boxShadow: `0 6px 18px ${orgColor}40`,
        }}>

          ติดต่อ {orgName}

      </div>

      {/* Info card */}
      <div style={{ margin: '0 16px 16px' }}>
        <div style={{

        </div>

// ─── Main collection schedule screen ─────────────────────────
function CollectionScheduleScreen({ orgColor, orgName, scheduleState, collectionType }) {
  const [toast, setToast] = React.useState(null);
  const hasSchedule = scheduleState === 'has_schedule';

  const showToast = msg => {
    setToast(msg);
    setTimeout(() => setToast(null), 2600);
  };

  const upcomingDates = React.useMemo(() => getUpcomingDates(ZONE_DATA.collectionDays), []);

  const handleAddCalendar = () => showToast("เพิ่มในปฏิทินแล้ว ✓");
  const handleViewMap = () => showToast("กำลังเปิดแผนที่โซน...");
  const handleContact = () => showToast("กำลังโทรหา " + orgName + "...");

  return (
    <div style={{
      fontFamily: "'Noto Sans Thai', -apple-system, system-ui, sans-serif",
      height: '100%', display: 'flex', flexDirection: 'column',
      background: '#F2F2F7', position: 'relative',
    }}>
      {/* Status bar spacer */}
      <div style={{ height: 62, flexShrink: 0 }}/>

      {/* Nav bar */}
      <div style={{ display: 'flex', alignItems: 'center', padding: '4px 16px 12px' }}>
        <button style={{
          background: 'none', border: 'none', cursor: 'pointer',
          display: 'flex', alignItems: 'center', gap: 5,
          color: orgColor, fontSize: 16, padding: '4px 0',
        }}>
          <IcChevronLeft size={9} color={orgColor}/>
          กลับ
        </button>
        <div style={{ flex: 1, textAlign: 'center', fontSize: 17, fontWeight: 600, color: '#181d26' }}>
          ตารางเก็บขยะ
        </div>
        <div style={{ width: 52 }}/>
      </div>

      {/* No schedule state */}
      {!hasSchedule ? (
        <NoScheduleState orgColor={orgColor} orgName={orgName} onContact={handleContact}/>
      ) : (
        <div style={{ flex: 1, overflowY: 'auto', paddingBottom: 44 }}>

          {/* Hero card */}
          <div style={{
            margin: '4px 16px 16px',
            background: 'white', borderRadius: 28,
            boxShadow: '0 1px 4px rgba(0,0,0,0.06), 0 2px 8px rgba(0,0,0,0.04)',
            overflow: 'hidden',
          }}>
            <TruckHero orgColor={orgColor} collectionType={collectionType}/>

            {/* Zone + route info */}
            <div style={{ padding: '16px 20px 20px' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 4 }}>
                <span style={{
                  fontSize: 22, fontWeight: 800, color: '#181d26', lineHeight: 1.2,
                }}>
                  {ZONE_DATA.zoneName}
                </span>
                <span style={{
                  fontSize: 13, fontWeight: 500, color: 'rgba(60,60,67,0.45)',
                  paddingTop: 4,
                }}>
                  {ZONE_DATA.zoneDetail}
                </span>
              </div>
              <div style={{
                display: 'inline-flex', alignItems: 'center', gap: 5,
                background: `${orgColor}10`, borderRadius: 10, padding: '4px 10px',
                marginBottom: 16,
              }}>
                <IcTruck size={13} color={orgColor}/>
                <span style={{ fontSize: 12, fontWeight: 600, color: orgColor }}>
                  {ZONE_DATA.routeName}
                </span>
              </div>

              {/* Week pills */}
              <div style={{ marginBottom: 6 }}>
                <div style={{
                  fontSize: 11, fontWeight: 600, color: 'rgba(60,60,67,0.4)',
                  letterSpacing: 0.6, textTransform: 'uppercase', marginBottom: 10,
                }}>วันที่เก็บขยะ</div>
                <WeekRow activeDays={ZONE_DATA.collectionDays} orgColor={orgColor}/>
              </div>
            </div>
          </div>

          {/* Zone details card */}
          <div style={{
            margin: '0 16px 16px',
            background: 'white', borderRadius: 20,
            boxShadow: '0 1px 4px rgba(0,0,0,0.06)',
            overflow: 'hidden',
          }}>
            <div style={{
              padding: '14px 16px 0',
              fontSize: 12, fontWeight: 600, color: 'rgba(60,60,67,0.45)',
              letterSpacing: 0.6, textTransform: 'uppercase',
            }}>รายละเอียดโซน</div>
            <div style={{ padding: '0 16px 4px' }}>
              <InfoRow
                icon={<IcMapPin size={18} color="#6b7280"/>}
                label="โซนพื้นที่"
                value={`${ZONE_DATA.zoneName} — ${ZONE_DATA.zoneDetail}`}
              />
              <InfoRow
                icon={<IcTruck size={18} color="#6b7280"/>}
                label="ประเภทการเก็บ"
                value={collectionType === 'door_to_door' ? 'เก็บหน้าบ้าน (Door-to-Door)' : 'จุดทิ้งรวม (Communal Point)'}
              />
              <InfoRow
                icon={<IcClock size={18} color="#6b7280"/>}
                label="ช่วงเวลาโดยประมาณ"
                value={ZONE_DATA.timeWindow}
              />
              <InfoRow
                icon={<IcHome size={18} color="#6b7280"/>}
                label="ความถี่"
                value="3 ครั้งต่อสัปดาห์ (จ. / พ. / ศ.)"
                last
              />
            </div>
          </div>

          {/* Upcoming schedule card */}
          <div style={{
            margin: '0 16px 16px',
            background: 'white', borderRadius: 20,
            boxShadow: '0 1px 4px rgba(0,0,0,0.06)',
            overflow: 'hidden',
          }}>
            <div style={{
              padding: '14px 16px 2px',
              fontSize: 12, fontWeight: 600, color: 'rgba(60,60,67,0.45)',
              letterSpacing: 0.6, textTransform: 'uppercase',
            }}>วันเก็บขยะที่กำลังจะมาถึง</div>
            <div style={{ padding: '0 16px 8px' }}>
              <UpcomingDates dates={upcomingDates} orgColor={orgColor}/>
            </div>
          </div>

          {/* Action buttons */}
          <div style={{ margin: '0 16px 16px', display: 'flex', gap: 10 }}>
            <button onClick={handleAddCalendar} style={{
              flex: 1, height: 50, borderRadius: 16,
              background: orgColor, border: 'none',
              color: 'white', fontSize: 14, fontWeight: 700,
              cursor: 'pointer',
              boxShadow: `0 5px 16px ${orgColor}40`,
              display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7,
            }}>
              <IcCalendarPlus size={16} color="white"/>
              เพิ่มในปฏิทิน
            </button>
            <button onClick={handleViewMap} style={{
              flex: 1, height: 50, borderRadius: 16,
              background: 'white', border: `1.5px solid ${orgColor}30`,
              color: orgColor, fontSize: 14, fontWeight: 700,
              cursor: 'pointer',
              boxShadow: '0 1px 4px rgba(0,0,0,0.06)',
              display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7,
            }}>
              <IcMap size={16} color={orgColor}/>
              ดูแผนที่โซน
            </button>
          </div>

          {/* Note card */}
          <div style={{ margin: '0 16px 16px' }}>
            <div style={{
              background: `${orgColor}08`,
              border: `1px solid ${orgColor}18`,
              borderRadius: 16, padding: '14px 16px',
              display: 'flex', gap: 10, alignItems: 'flex-start',
            }}>
              <IcInfo size={18} color={orgColor}/>
              <div>
                <div style={{ fontSize: 13, fontWeight: 600, color: orgColor, marginBottom: 3 }}>
                  หมายเหตุ
                </div>
                <div style={{ fontSize: 12, color: 'rgba(60,60,67,0.55)', lineHeight: 1.7 }}>
                  เวลาเป็นเพียงการประมาณการ รถอาจมาก่อนหรือหลังได้ กรุณานำขยะออกมาวางไว้หน้าบ้านก่อน 06:00 น.
                </div>
              </div>
            </div>
          </div>

        </div>
      )}

      {/* Toast */}
      {toast && (
        <div style={{
          position: 'absolute', bottom: 56, left: 20, right: 20, zIndex: 100,
          background: 'rgba(24,29,38,0.88)', color: 'white',
          padding: '12px 16px', borderRadius: 12,
          fontSize: 14, textAlign: 'center',
          backdropFilter: 'blur(12px)',
          boxShadow: '0 4px 16px rgba(0,0,0,0.25)',
        }}>
          {toast}
        </div>
      )}
    </div>
  );
}

// ─── Tweaks Panel ─────────────────────────────────────────────
const ORG_COLORS = ["#1b61c9","#DC2626","#059669","#D97706","#7C3AED","#DB2777","#0891B2"];

function TweaksPanel({ tweaks, onChange, onClose }) {
  return (
    <div style={{
      position: 'fixed', inset: 0, zIndex: 9999,
      display: 'flex', alignItems: 'flex-end', justifyContent: 'center',
      background: 'rgba(0,0,0,0.45)', backdropFilter: 'blur(4px)',
    }} onClick={onClose}>
      <div style={{
        background: 'white', borderRadius: '22px 22px 0 0',
        padding: '16px 20px 40px', width: '100%', maxWidth: 500,
        boxShadow: '0 -4px 28px rgba(0,0,0,0.14)',
      }} onClick={e => e.stopPropagation()}>
        <div style={{ display: 'flex', justifyContent: 'center', marginBottom: 18 }}>
          <div style={{ width: 36, height: 4, borderRadius: 2, background: 'rgba(60,60,67,0.2)' }}/>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 24 }}>
          <span style={{ fontSize: 17, fontWeight: 600, color: '#181d26' }}>Tweaks</span>
          <button onClick={onClose} style={{ background: '#f0f0f5', border: 'none', width: 28, height: 28, borderRadius: 8, cursor: 'pointer', fontSize: 14, color: '#666', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>✕</button>
        </div>

        {/* Schedule State */}
        <div style={{ marginBottom: 24 }}>
          <label style={{ display: 'block', fontSize: 12, color: 'rgba(60,60,67,0.55)', marginBottom: 10, fontWeight: 600, letterSpacing: 0.5, textTransform: 'uppercase' }}>
            สถานะตาราง
          </label>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            {[
              ["has_schedule", "มีตารางเก็บขยะ", "#059669"],
              ["no_schedule",  "ยังไม่ได้กำหนด",  "#D97706"],
            ].map(([v, l, c]) => (
              <button key={v} onClick={() => onChange('scheduleState', v)} style={{
                padding: '11px 14px', borderRadius: 12, border: 'none', textAlign: 'left',
                background: tweaks.scheduleState === v ? `${c}15` : '#f0f0f5',
                cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'space-between',
              }}>
                <span style={{ fontSize: 14, fontWeight: 500, color: tweaks.scheduleState === v ? c : '#444' }}>{l}</span>
                {tweaks.scheduleState === v && (
                  <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M3 8.5L6.5 12L13 5" stroke={c} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
                  </svg>
                )}
              </button>
            ))}
          </div>
        </div>

        {/* Collection Type */}
        {tweaks.scheduleState === 'has_schedule' && (
          <div style={{ marginBottom: 24 }}>
            <label style={{ display: 'block', fontSize: 12, color: 'rgba(60,60,67,0.55)', marginBottom: 10, fontWeight: 600, letterSpacing: 0.5, textTransform: 'uppercase' }}>
              ประเภทการเก็บ
            </label>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              {[
                ["door_to_door", "เก็บหน้าบ้าน (Door-to-Door)", "#1b61c9"],
                ["communal",     "จุดทิ้งรวม (Communal Point)", "#059669"],
              ].map(([v, l, c]) => (
                <button key={v} onClick={() => onChange('collectionType', v)} style={{
                  padding: '11px 14px', borderRadius: 12, border: 'none', textAlign: 'left',
                  background: tweaks.collectionType === v ? `${c}15` : '#f0f0f5',
                  cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                }}>
                  <span style={{ fontSize: 14, fontWeight: 500, color: tweaks.collectionType === v ? c : '#444' }}>{l}</span>
                  {tweaks.collectionType === v && (
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                      <path d="M3 8.5L6.5 12L13 5" stroke={c} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
                    </svg>
                  )}
                </button>
              ))}
            </div>
          </div>
        )}

        {/* Org Color */}
        <div>
          <label style={{ display: 'block', fontSize: 12, color: 'rgba(60,60,67,0.55)', marginBottom: 10, fontWeight: 600, letterSpacing: 0.5, textTransform: 'uppercase' }}>
            สี อปท. (Org Color)
          </label>
          <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', alignItems: 'center' }}>
            {ORG_COLORS.map(c => (
              <button key={c} onClick={() => onChange('orgColor', c)} style={{
                width: 34, height: 34, borderRadius: 10, background: c, border: 'none', cursor: 'pointer',
                boxShadow: tweaks.orgColor === c ? `0 0 0 3px white, 0 0 0 5px ${c}` : 'none',
                transition: 'box-shadow 0.15s',
              }}/>
            ))}
            <input type="color" value={tweaks.orgColor}
              onChange={e => onChange('orgColor', e.target.value)}
              style={{ width: 34, height: 34, borderRadius: 10, border: '1.5px solid #e0e2e6', cursor: 'pointer', padding: 2 }}
            />
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── App ──────────────────────────────────────────────────────
function App() {
  const [tweaks, setTweaks] = React.useState(() => {
    try {
      const saved = localStorage.getItem('r09-tweaks');
      return saved ? { ...TWEAK_DEFAULTS, ...JSON.parse(saved) } : TWEAK_DEFAULTS;
    } catch { return TWEAK_DEFAULTS; }
  });
  const [showTweaks, setShowTweaks] = React.useState(false);

  const handleChange = (key, val) => {
    const next = { ...tweaks, [key]: val };
    setTweaks(next);
    localStorage.setItem('r09-tweaks', JSON.stringify(next));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: val } }, '*');
  };

  React.useEffect(() => {
    const handler = e => {
      if (e.data?.type === '__activate_edit_mode')   setShowTweaks(true);
      if (e.data?.type === '__deactivate_edit_mode') setShowTweaks(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  return (
    <>
      <IOSDevice width={393} height={852}>
        <CollectionScheduleScreen
          orgColor={tweaks.orgColor}
          orgName={tweaks.orgName}
          scheduleState={tweaks.scheduleState}
          collectionType={tweaks.collectionType}
        />
      </IOSDevice>
      {showTweaks && (
        <TweaksPanel tweaks={tweaks} onChange={handleChange} onClose={() => setShowTweaks(false)}/>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
