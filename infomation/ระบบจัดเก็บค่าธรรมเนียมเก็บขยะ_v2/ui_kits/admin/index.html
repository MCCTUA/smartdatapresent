<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>utilitfeeapp — Admin Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@100;200;300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root { height: 100%; }
  body {
    font-family: 'Prompt', 'Inter', -apple-system, system-ui, sans-serif;
    background: #f8fafc;
    color: #181d26;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  :root {
    --org-primary: #1b61c9;
    --org-primary-dark: #1550b0;
    --org-primary-light: #dbeafe;
    --org-primary-tint: #eff6ff;
    --navy: #181d26;
    --border: #e0e2e6;
    --surface: #ffffff;
    --subtle: #f8fafc;
    --text-weak: rgba(4,14,32,0.55);
    --shadow-card: 0px 1px 3px rgba(0,0,0,0.07), 0px 0px 1px rgba(0,0,0,0.12);
    --shadow-blue: rgba(0,0,0,0.32) 0px 0px 1px, rgba(45,127,249,0.22) 0px 1px 3px;
    --radius-btn: 10px;
    --radius-card: 14px;
  }
  * { scrollbar-width: thin; scrollbar-color: #e0e2e6 transparent; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="Sidebar.jsx"></script>
<script type="text/babel" src="Header.jsx"></script>
<script type="text/babel" src="BillsTable.jsx"></script>
<script type="text/babel" src="DashboardHome.jsx"></script>
<script type="text/babel" src="PaymentModal.jsx"></script>
<script type="text/babel">
// ── Main App ─────────────────────────────────────────────────────────────
const { useState, useEffect } = React;

const SCREENS = ['dashboard', 'bills', 'payments', 'households', 'meters', 'approvals', 'issues', 'reports', 'settings'];

function App() {
  const [screen, setScreen] = useState(() => localStorage.getItem('admin_screen') || 'dashboard');
  const [paymentBill, setPaymentBill] = useState(null);
  const [sidebarCollapsed, setSidebarCollapsed] = useState(false);

  useEffect(() => { localStorage.setItem('admin_screen', screen); }, [screen]);

  return (
    <div style={{ display:'flex', height:'100vh', overflow:'hidden' }}>
      <AppSidebar
        active={screen}
        onNav={setScreen}
        collapsed={sidebarCollapsed}
        onToggle={() => setSidebarCollapsed(c => !c)}
      />
      <div style={{ flex:1, display:'flex', flexDirection:'column', minWidth:0, overflow:'hidden' }}>
        <AppHeader screen={screen} />
        <main style={{ flex:1, overflow:'auto', padding:'24px' }}>
          {screen === 'dashboard' && <DashboardHome onNav={setScreen} onPayBill={setPaymentBill} />}
          {screen === 'bills'     && <BillsScreen onPayBill={setPaymentBill} />}
          {screen === 'payments'  && <PaymentsScreen />}
          {screen === 'households'&& <PlaceholderScreen title="ทะเบียนครัวเรือน" desc="จัดการข้อมูลบ้านและสมาชิกในครัวเรือน" />}
          {screen === 'meters'    && <PlaceholderScreen title="มิเตอร์" desc="บันทึกและตรวจสอบค่ามิเตอร์น้ำ / ไฟฟ้า" />}
          {screen === 'approvals' && <PlaceholderScreen title="อนุมัติ" desc="Maker/Checker workflow — ยกเลิกบิล ปรับยอด คืนเงิน" />}
          {screen === 'issues'    && <PlaceholderScreen title="ร้องเรียน / ติดตาม" desc="Issue tracking พร้อม SLA และการมอบหมาย" />}
          {screen === 'reports'   && <PlaceholderScreen title="รายงาน" desc="สรุปรายรับ ค้างชำระ และการจัดเก็บ" />}
          {screen === 'settings'  && <PlaceholderScreen title="ตั้งค่าองค์กร" desc="ข้อมูล อปท. ผู้ใช้งาน และสีประจำหน่วยงาน" />}
        </main>
      </div>
      {paymentBill && <PaymentModal bill={paymentBill} onClose={() => setPaymentBill(null)} />}
    </div>
  );
}

// ── Placeholder screen ────────────────────────────────────────────────────
function PlaceholderScreen({ title, desc }) {
  return (
    <div style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', height:'100%', minHeight:320, gap:12, color:'rgba(4,14,32,.45)' }}>
      <div style={{ width:56, height:56, border:'2px dashed #e0e2e6', borderRadius:14, display:'flex', alignItems:'center', justifyContent:'center' }}>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
      </div>
      <div style={{ textAlign:'center' }}>
        <div style={{ fontSize:15, fontWeight:600, color:'#181d26', marginBottom:4 }}>{title}</div>
        <div style={{ fontSize:13 }}>{desc}</div>
      </div>
    </div>
  );
}

// ── Bills Screen wrapper ──────────────────────────────────────────────────
function BillsScreen({ onPayBill }) {
  return <BillsTable onPayBill={onPayBill} />;
}

// ── Payments Screen ───────────────────────────────────────────────────────
const PAYMENT_DATA = [
  { id:'RCP-2569-0841', household:'สมชาย จันทร์ดี', date:'21 เม.ย. 2569', amount:60, method:'เงินสด', type:'ค่าขยะ' },
  { id:'RCP-2569-0840', household:'อรุณี พรมดี', date:'21 เม.ย. 2569', amount:180, method:'PromptPay', type:'ค่าน้ำ' },
  { id:'RCP-2569-0839', household:'ประยุทธ์ สุขใจ', date:'20 เม.ย. 2569', amount:360, method:'Counter Service', type:'ค่าน้ำ' },
  { id:'RCP-2569-0838', household:'วิมล แสงทอง', date:'20 เม.ย. 2569', amount:60, method:'LINE Pay', type:'ค่าขยะ' },
  { id:'RCP-2569-0837', household:'นิยม รักไทย', date:'19 เม.ย. 2569', amount:240, method:'เงินสด', type:'ค่าน้ำ' },
];

function PaymentsScreen() {
  return (
    <div>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:20 }}>
        <div>
          <h1 style={{ fontSize:20, fontWeight:600 }}>ประวัติการรับชำระเงิน</h1>
          <p style={{ fontSize:13, color:'rgba(4,14,32,.55)', marginTop:2 }}>รายการใบเสร็จที่ออกในระบบ</p>
        </div>
        <button style={btnPrimary}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><polyline points="6 9 12 15 18 9"/></svg>
          ส่งออก Excel
        </button>
      </div>
      <div style={cardStyle}>
        <table style={{ width:'100%', borderCollapse:'collapse', fontSize:13 }}>
          <thead>
            <tr>
              {['เลขที่ใบเสร็จ','ครัวเรือน','ประเภท','วันที่','ช่องทาง','จำนวนเงิน',''].map(h => (
                <th key={h} style={thStyle}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {PAYMENT_DATA.map(r => (
              <tr key={r.id} style={{ borderBottom:'1px solid #f0f0f2' }}
                  onMouseEnter={e => e.currentTarget.style.background='#f5f8ff'}
                  onMouseLeave={e => e.currentTarget.style.background=''}>
                <td style={tdStyle}><span style={{ fontFamily:'monospace', fontSize:12, color:'#1b61c9' }}>{r.id}</span></td>
                <td style={tdStyle}><span style={{ fontWeight:500 }}>{r.household}</span></td>
                <td style={tdStyle}>{r.type}</td>
                <td style={tdStyle}>{r.date}</td>
                <td style={tdStyle}><span style={{ background:'#f3f4f6', borderRadius:4, padding:'2px 7px', fontSize:11, fontWeight:500 }}>{r.method}</span></td>
                <td style={{ ...tdStyle, textAlign:'right', fontWeight:500, fontVariantNumeric:'tabular-nums' }}>฿{r.amount.toFixed(2)}</td>
                <td style={tdStyle}><button style={{ background:'none', border:'1px solid #e0e2e6', borderRadius:6, padding:'3px 9px', fontSize:11, color:'#1b61c9', cursor:'pointer', fontFamily:'DM Sans,sans-serif' }}>พิมพ์</button></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

const cardStyle = { background:'#fff', border:'1px solid #e0e2e6', borderRadius:14, overflow:'hidden', boxShadow:'0px 1px 3px rgba(0,0,0,0.07)' };
const thStyle = { background:'#f8fafc', padding:'8px 14px', textAlign:'left', fontSize:11, fontWeight:600, color:'rgba(4,14,32,.5)', letterSpacing:'.4px', textTransform:'uppercase', borderBottom:'1px solid #e0e2e6', whiteSpace:'nowrap' };
const tdStyle = { padding:'11px 14px', verticalAlign:'middle' };
const btnPrimary = { background:'var(--org-primary)', color:'#fff', border:'none', borderRadius:10, padding:'8px 18px', fontSize:13, fontWeight:500, cursor:'pointer', fontFamily:'DM Sans,sans-serif', display:'inline-flex', alignItems:'center', gap:6, letterSpacing:'.05px' };

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
